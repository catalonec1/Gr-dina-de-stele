<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paper River</title>
<meta name="description" content="Steer a paper boat down an endless river at dusk. Collect lanterns, dodge rocks and logs, unlock new boats.">
<meta name="theme-color" content="#14213d">
<style>
:root{--bg:#0d1630;--panel:#17244a;--line:#2b3d75;--ink:#f1f4ff;--dim:#9aa6d6;--acc:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:2}
.screen.on{display:flex}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;cursor:pointer}
button:active{transform:scale(.97)}
button.big{font-size:20px;padding:14px 0;width:min(78vw,300px);margin:6px 0}
button.pri{background:linear-gradient(180deg,#ffd27a,#ff9f43);color:#3a1d00;border:none;font-weight:700}
button.ico{padding:8px 12px;min-width:46px;min-height:44px}
button:disabled{opacity:.45}
#menu{background:linear-gradient(180deg,rgba(13,22,48,.55),rgba(13,22,48,.2) 60%,rgba(13,22,48,.6))}
#menu h1{margin:10vh 0 4px;font-size:clamp(38px,10vw,60px);letter-spacing:1px;color:#fff6e5;text-shadow:0 0 24px rgba(255,179,71,.6)}
#menu .sub{color:#d9e0ff;margin:0 16px 3vh;text-align:center;max-width:420px}
#menuInfo{color:var(--acc);margin-bottom:12px;font-weight:600}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:center;justify-content:space-between;padding:10px;z-index:3;pointer-events:none}
#hud.on{display:flex}
#hud button{pointer-events:auto}
#hud .sc{font-weight:800;font-size:24px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hud .ln{font-weight:700;font-size:18px;color:var(--acc);text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hud .bx{display:flex;flex-direction:column;align-items:flex-start}
#tut{pointer-events:none;position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);background:rgba(10,16,40,.78);border:1px solid var(--line);padding:10px 16px;border-radius:14px;text-align:center;z-index:3;display:none;max-width:88vw}
#tut.on{display:block}
#shop{background:var(--bg)}
.top{width:100%;display:flex;align-items:center;gap:10px;padding:10px;max-width:520px}
.top h2{margin:0;font-size:20px;flex:1}
.top .ln{color:var(--acc);font-weight:700}
#skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 16px 30px;width:min(100%,520px);overflow-y:auto}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.sk.sel{outline:3px solid var(--acc)}
.sk canvas{position:static;width:96px;height:96px;display:block;margin:0 auto}
.sk b{display:block;margin:4px 0 8px}
.sk button{width:100%;padding:8px}
#overlay{position:fixed;inset:0;background:rgba(5,8,20,.7);display:none;align-items:center;justify-content:center;z-index:5}
#overlay.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 26px;text-align:center;min-width:270px;max-width:90vw}
.card h3{margin:0 0 8px;font-size:26px}
.card .big{width:100%}
.card p{margin:6px 0;color:var(--dim)}
.card .val{font-size:34px;font-weight:800;color:#fff}
.nb{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(23,36,74,.92);padding:8px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<section id="menu" class="screen on">
  <h1>Paper River</h1>
  <div class="sub" data-i="tag"></div>
  <div id="menuInfo"></div>
  <button class="big pri" id="bPlay"></button>
  <button class="big" id="bDaily"></button>
  <button class="big" id="bQuests"></button>
  <button class="big" id="bShop"></button>
  <div class="row" style="margin-top:22px">
    <button class="ico" id="bLang"></button>
    <button class="ico" id="bSound"></button>
    <button class="ico" id="bMusic"></button>
  </div>
</section>
<section id="shop" class="screen">
  <div class="top"><button class="ico" id="bShopBack">‹</button><h2 data-i="boats"></h2><span class="ln" id="shopCoins"></span></div>
  <div id="skins"></div>
</section>
<div id="hud">
  <div class="bx"><div class="sc" id="hScore">0</div><div class="ln" id="hLan">🏮 0</div></div>
  <button class="ico" id="bPause">Ⅱ</button>
</div>
<div id="tut"></div>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="toast"></div>
<script>
"use strict";
// ---------- Texte (RO / EN / RU) ----------
const T = {
  en: { tag: "Steer a paper boat down the river at dusk. Collect lanterns, dodge rocks and logs.", play: "Play", daily: "Daily river", dailyBest: "Daily river · best {n} m", boats: "Boats", best: "Best: {n} m", over: "The boat ran aground!", dist: "Distance", lanterns: "Lanterns: +{n} 🏮", newBest: "New record!", again: "Play again", menu: "Menu", revive: "Continue · {n} 🏮", paused: "Paused", resume: "Resume", tut: "Drag left or right to steer. Collect lanterns 🏮, avoid rocks.", tutKeys: "Keyboard: A / D or ← →", shield: "Lotus shield!", magnet: "Lantern magnet!", saved: "The lotus saved you!", buy: "Buy · {n} 🏮", use: "Use", inUse: "Selected", noCoins: "Not enough lanterns", sound: "Sound", music: "Music", lang: "EN", quests: "Quests", questsTitle: "Today's quests", claim: "Claim +{n} 🏮", done: "Done ✓", close: "Close", goldLan: "Golden lantern +5!", whatsNew: "New in v{v}: the Swan boat and 3 tougher daily quests",
    q: { lan: "Collect {n} lanterns", dist: "Sail {n} m in one run", power: "Pick up {n} power-ups", runs: "Play {n} runs", gold: "Find {n} golden lanterns" },
    skins: ["Paper", "Lotus", "Sky", "Golden", "Night ink", "Aurora", "Crane", "Ember", "Ice", "Swan"] },
  ro: { tag: "Condu o bărcuță de hârtie pe râu, la apus. Adună felinare, ocolește stâncile și buștenii.", play: "Joacă", daily: "Râul zilei", dailyBest: "Râul zilei · record {n} m", boats: "Bărci", best: "Record: {n} m", over: "Barca s-a împotmolit!", dist: "Distanța", lanterns: "Felinare: +{n} 🏮", newBest: "Record nou!", again: "Încă o dată", menu: "Meniu", revive: "Continuă · {n} 🏮", paused: "Pauză", resume: "Continuă", tut: "Trage stânga sau dreapta ca să cârmești. Adună felinare 🏮, ocolește stâncile.", tutKeys: "Tastatură: A / D sau ← →", shield: "Scut de lotus!", magnet: "Magnet de felinare!", saved: "Lotusul te-a salvat!", buy: "Cumpără · {n} 🏮", use: "Alege", inUse: "Aleasă", noCoins: "Nu ai destule felinare", sound: "Sunet", music: "Muzică", lang: "RO", quests: "Misiuni", questsTitle: "Misiunile zilei", claim: "Ia +{n} 🏮", done: "Gata ✓", close: "Închide", goldLan: "Felinar de aur +5!", whatsNew: "Noutăți v{v}: barca Lebădă și 3 misiuni zilnice mai grele",
    q: { lan: "Adună {n} felinare", dist: "Navighează {n} m într-o tură", power: "Prinde {n} puteri", runs: "Joacă {n} ture", gold: "Găsește {n} felinare de aur" },
    skins: ["Hârtie", "Lotus", "Cer", "Aurie", "Cerneală", "Auroră", "Cocor", "Jar", "Gheață", "Lebădă"] },
  ru: { tag: "Ведите бумажный кораблик по реке на закате. Собирайте фонарики, обходите камни и брёвна.", play: "Играть", daily: "Река дня", dailyBest: "Река дня · рекорд {n} м", boats: "Кораблики", best: "Рекорд: {n} м", over: "Кораблик сел на мель!", dist: "Расстояние", lanterns: "Фонарики: +{n} 🏮", newBest: "Новый рекорд!", again: "Ещё раз", menu: "Меню", revive: "Продолжить · {n} 🏮", paused: "Пауза", resume: "Продолжить", tut: "Тяните влево или вправо, чтобы рулить. Собирайте фонарики 🏮, обходите камни.", tutKeys: "Клавиатура: A / D или ← →", shield: "Щит лотоса!", magnet: "Магнит фонариков!", saved: "Лотос спас вас!", buy: "Купить · {n} 🏮", use: "Выбрать", inUse: "Выбран", noCoins: "Не хватает фонариков", sound: "Звук", music: "Музыка", lang: "RU", quests: "Задания", questsTitle: "Задания дня", claim: "Забрать +{n} 🏮", done: "Готово ✓", close: "Закрыть", goldLan: "Золотой фонарик +5!", whatsNew: "Новое в v{v}: кораблик-лебедь и 3 сложных ежедневных задания",
    q: { lan: "Соберите {n} фонариков", dist: "Проплывите {n} м за один заплыв", power: "Подберите усилений: {n}", runs: "Сыграйте заплывов: {n}", gold: "Найдите золотых фонариков: {n}" },
    skins: ["Бумага", "Лотос", "Небо", "Золото", "Тушь", "Сияние", "Журавль", "Уголёк", "Лёд", "Лебедь"] },
};
const LANGS = ["en", "ro", "ru"];
function detectLang() {
  const l = (navigator.language || "en").slice(0, 2).toLowerCase();
  return l === "ro" || l === "mo" ? "ro" : l === "ru" ? "ru" : "en";
}
const t = (k, v = {}) => String(T[S.lang][k] ?? T.en[k]).replace(/\{(\w+)\}/g, (_, x) => v[x]);

// ---------- Salvare ----------
const KEY = "paper-river-v1", VERSION = "1.3";
let S = { lang: detectLang(), sound: true, music: true, best: 0, coins: 0, owned: [0], skin: 0, daily: {}, tut: false, runs: 0, quests: null, seen: null };
let Store = null; try { Store = window.localStorage; } catch (e) {}
try { const d = JSON.parse(Store.getItem(KEY)); if (d) S = Object.assign(S, d); } catch (e) {}
if (!T[S.lang]) S.lang = "en";
const showNews = S.seen !== null && S.seen !== VERSION || (S.seen === null && S.runs > 0);
S.seen = VERSION;
function save() { try { Store.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- Bărci (cosmetice, cu felinare) ----------
const SKINS = [
  { price: 0, hull: "#f4f1e8", sail: "#ffffff", edge: "#b9b3a3" },
  { price: 60, hull: "#ffc2d6", sail: "#ffe3ee", edge: "#d9779b" },
  { price: 150, hull: "#9fd8ff", sail: "#e3f4ff", edge: "#4d9bd1" },
  { price: 300, hull: "#ffd36b", sail: "#fff2c4", edge: "#c8962a" },
  { price: 500, hull: "#2a2f45", sail: "#ffcf5c", edge: "#11131f" },
  { price: 800, hull: "#9cf6d4", sail: "#d9b8ff", edge: "#5a7bd8", aurora: true },
  { price: 1100, hull: "#fbfbf6", sail: "#e63946", edge: "#8d99ae" },
  { price: 1500, hull: "#3d1f14", sail: "#ff7b2e", edge: "#ffb347", ember: true },
  { price: 2000, hull: "#e8f6ff", sail: "#bfe6ff", edge: "#5fa8d3", frost: true }, // Gheață (v1.2)
  { price: 2600, hull: "#ffffff", sail: "#f4f1ea", edge: "#2b2d42", swan: true }, // Lebădă (v1.3)
];
// ---------- Misiuni zilnice (v1.1): 3 pe zi, alese determinist după dată ----------
const QUEST_POOL = [
  { k: "lan", n: 40, r: 15 }, { k: "lan", n: 90, r: 30 }, { k: "dist", n: 600, r: 15 }, { k: "dist", n: 1200, r: 30 },
  { k: "power", n: 3, r: 20 }, { k: "runs", n: 3, r: 15 }, { k: "gold", n: 2, r: 25 },
  { k: "lan", n: 150, r: 45 }, { k: "dist", n: 2000, r: 45 }, { k: "power", n: 6, r: 35 }, // v1.3: misiuni grele
];
function ensureQuests() {
  const day = todayStr();
  if (S.quests && S.quests.day === day) return S.quests;
  const R = rng(hashStr("quests:" + day)), list = [], kinds = new Set();
  for (let i = 0; list.length < 3 && i < 60; i++) {
    const q = QUEST_POOL[Math.floor(R() * QUEST_POOL.length)];
    if (kinds.has(q.k)) continue; kinds.add(q.k); list.push({ k: q.k, n: q.n, r: q.r, prog: 0, claimed: false });
  }
  S.quests = { day, list }; return S.quests;
}
function qtrack(k, v, max = false) {
  const Q = ensureQuests(); let ch = false;
  for (const q of Q.list) if (q.k === k && q.prog < q.n) { q.prog = Math.min(q.n, max ? Math.max(q.prog, v) : q.prog + v); ch = true; }
  return ch;
}
const questsReady = () => ensureQuests().list.filter(q => q.prog >= q.n && !q.claimed).length;
function claimQuest(i) {
  const q = ensureQuests().list[i]; if (!q || q.claimed || q.prog < q.n) return;
  q.claimed = true; S.coins += q.r; save(); sfx("power"); showQuests(); applyLang();
}

// ---------- Lumea: râu procedural, determinist dintr-un seed ----------
const VW = 360, BOAT_R = 11, VMAX = 300, MAXR = 20, REVIVE = 20;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const hash1 = n => { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
function riverAt(y) { // centrul și semilățimea râului la distanța y
  return [180 + 28 * Math.sin(y / 520) + 12 * Math.sin(y / 173 + 1.3), 118 + 18 * Math.sin(y / 760 + 0.7)];
}
function bankLimits(y, pad) { const [c, w] = riverAt(y); return [Math.max(c - w, 4) + pad, Math.min(c + w, VW - 4) - pad]; }
const speedAt = d => Math.min(360, 150 + d / 50);
const spacingAt = d => Math.max(150, 230 - d / 150);
const gapAt = d => Math.max(36, 62 - d / 300);
// deplasarea laterală maximă între două șiruri, ca să existe mereu o cale
const shiftAt = d => 0.8 * VMAX * (spacingAt(d) - 2 * (MAXR + BOAT_R)) / speedAt(d);
function todayStr(dt = new Date()) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
const dailySeed = s => hashStr("paper-river:" + s);

// Generează un șir de obstacole la distanța y; întoarce trecerea (gap) și obiectele
function genRow(R, y, prevGx, first) {
  const [c, w] = riverAt(y), gh = gapAt(y), sh = shiftAt(y);
  const [lo, hi] = bankLimits(y, gh);
  let gx = prevGx + (R() * 2 - 1) * sh;
  gx = clamp(clamp(gx, prevGx - sh, prevGx + sh), lo, hi);
  const obs = [], items = [], L = c - w - 10, Rt = c + w + 10, gl = gx - gh, gr = gx + gh;
  const fill = (a, b) => { // umple [a,b] cu stânci și bușteni, fără goluri prin care să treacă barca
    let x = a;
    while (x < b) {
      if (R() < 0.22 && b - x > 50) { const len = Math.min(b - x, 40 + R() * 50); obs.push({ log: true, x1: x + 9, x2: x + len - 9, y, r: 9 }); x += len + R() * 12; continue; }
      let r = 13 + R() * (MAXR - 13); if (x + 2 * r > b) r = (b - x) / 2;
      if (r < 6) break;
      obs.push({ x: x + r, y, r }); x += 2 * r + R() * 14;
    }
  };
  const sparse = first || R() < 0.3;
  if (sparse) { // 1–2 stânci izolate, departe de trecere
    const n = 1 + (R() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const r = 13 + R() * 6, left = R() < 0.5;
      const a = left ? Math.max(L, 4) + r : gr + r, b = left ? gl - r : Math.min(Rt, VW - 4) - r;
      if (b > a) obs.push({ x: a + R() * (b - a), y, r });
    }
  } else { fill(L, gl); fill(gr, Rt); }
  const k = R();
  if (y > 900 && k < 0.05) items.push({ x: gx, y, kind: "lotus" });
  else if (y > 900 && k < 0.09) items.push({ x: gx, y, kind: "magnet" });
  else if (y > 600 && k < 0.13) items.push({ x: gx, y, kind: "gold" });
  else items.push({ x: gx, y, kind: "lan" });
  if (R() < 0.5) { const sp = spacingAt(y); for (const f of [0.25, 0.5, 0.75]) items.push({ x: prevGx + (gx - prevGx) * f, y: y - sp + sp * f, kind: "lan" }); }
  return { y, gx, gh, obs, items };
}

// ---------- Starea partidei ----------
let G = null;
function newRun(seed, daily) {
  G = { seed, daily, R: rng(seed), d: 0, t: 0, speed: speedAt(0), x: 180, vx: 0, tx: null, keyDir: 0, drag: null,
    rows: [], obs: [], items: [], parts: [], genY: 260, gx: 180, lan: 0, shield: false, magnet: 0, inv: 0,
    alive: true, paused: false, revived: false, over: false, firstRow: true };
  genAhead();
}
function genAhead() {
  while (G.genY < G.d + 1400) {
    const row = genRow(G.R, G.genY, G.gx, G.firstRow); G.firstRow = false;
    G.rows.push(row); G.obs.push(...row.obs); G.items.push(...row.items);
    G.gx = row.gx; G.genY += spacingAt(G.genY);
  }
}
const score = () => Math.floor(G.d / 10);
function hitObs(o, x, y, r) {
  if (o.log) { const px = clamp(x, o.x1, o.x2); return Math.hypot(x - px, y - o.y) < o.r + r; }
  return Math.hypot(x - o.x, y - o.y) < o.r * 0.92 + r;
}
function step(dt) {
  if (!G || !G.alive || G.paused) return;
  G.t += dt; G.speed = speedAt(G.d); G.d += G.speed * dt;
  genAhead();
  let want = 0;
  if (G.keyDir) want = G.keyDir * VMAX; else if (G.tx != null) want = clamp((G.tx - G.x) * 12, -VMAX, VMAX);
  G.vx += (want - G.vx) * Math.min(1, dt * 16);
  G.x += G.vx * dt;
  const [lo, hi] = bankLimits(G.d, BOAT_R);
  if (G.x < lo) { G.x = lo; G.vx = 0; } if (G.x > hi) { G.x = hi; G.vx = 0; }
  if (G.tx != null) G.tx = clamp(G.tx, lo, hi);
  if (G.inv > 0) G.inv -= dt;
  if (G.magnet > 0) G.magnet -= dt;
  // trena bărcii
  if (Math.random() < 0.6) G.parts.push({ x: G.x + (Math.random() - 0.5) * 10, y: G.d - 14, vx: (Math.random() - 0.5) * 20, life: 1, kind: "wake" });
  for (const p of G.parts) { p.life -= dt * (p.kind === "wake" ? 0.9 : 1.6); p.x += p.vx * dt; if (p.vy) p.y += p.vy * dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  // obiecte
  for (const it of G.items) {
    if (it.got) continue;
    if (G.magnet > 0 && (it.kind === "lan" || it.kind === "gold") && it.y - G.d < 220 && it.y > G.d - 20) { it.x += (G.x - it.x) * Math.min(1, dt * 6); it.y += (G.d - it.y) * Math.min(1, dt * 4); }
    if (Math.hypot(it.x - G.x, it.y - G.d) < BOAT_R + 13) collect(it);
  }
  for (const o of G.obs) {
    if (o.y < G.d - 40 || o.y > G.d + 40 || o.gone) continue;
    if (hitObs(o, G.x, G.d, BOAT_R)) { crash(o); if (!G.alive) return; }
  }
  const cut = G.d - 320;
  if (G.obs.length && G.obs[0].y < cut) G.obs = G.obs.filter(o => o.y >= cut);
  if (G.items.length && G.items[0].y < cut) G.items = G.items.filter(i => i.y >= cut && !i.got);
  if (G.rows.length && G.rows[0].y < cut) G.rows = G.rows.filter(r => r.y >= cut);
}
function burst(x, y, col, n = 10) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 40 + Math.random() * 80; G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, kind: "spark", col }); } }
function collect(it) {
  it.got = true;
  if (it.kind === "lan") { G.lan++; G.qlan = (G.qlan || 0) + 1; sfx("lan"); burst(it.x, it.y, "#ffb347", 6); return; }

  if (k === "lan") tone(880 + Math.random() * 200, 0.15, "triangle", 0.07, 1.5);
  else if (k === "power") { tone(523, 0.15, "triangle", 0.08); tone(784, 0.2, "triangle", 0.08, 0, 0.08); tone(1046, 0.3, "triangle", 0.08, 0, 0.16); }
  else if (k === "crash") { tone(160, 0.5, "sawtooth", 0.08, 0.4); tone(90, 0.6, "square", 0.05, 0.5); }
  else if (k === "break") tone(300, 0.3, "triangle", 0.09, 0.5);
  else tone(660, 0.07, "sine", 0.06);
}
const PENTA = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
function music() { // arpegiu liniștit, pentatonic
  if (!S.music || !AC || mode !== "play" || !G || !G.alive || G.paused) return;
  if (AC.currentTime < nextNote) return;
  nextNote = AC.currentTime + 0.42; noteI++;
  const f = PENTA[(noteI * 3 + (noteI >> 3) * 2) % PENTA.length] / (noteI % 4 === 0 ? 2 : 1);
  tone(f, 0.9, "sine", 0.035);
}

// ---------- Control ----------
let drag = null;
cv.addEventListener("pointerdown", e => { if (mode !== "play" || !G || !G.alive || G.paused) return; ac(); drag = { px: e.clientX, x0: G.x }; G.keyDir = 0; endTut(); });
addEventListener("pointermove", e => { if (!drag || !G) return; G.tx = drag.x0 + (e.clientX - drag.px) / SC * 1.25; });
addEventListener("pointerup", () => { drag = null; });
addEventListener("pointercancel", () => { drag = null; });
const KL = ["ArrowLeft", "KeyA"], KR = ["ArrowRight", "KeyD"];
addEventListener("keydown", e => {
  if (mode === "play" && G) {
    if (KL.includes(e.code)) { G.keyDir = -1; G.tx = null; endTut(); }
    else if (KR.includes(e.code)) { G.keyDir = 1; G.tx = null; endTut(); }
    else if (e.code === "Escape" || e.code === "KeyP") pause(!G.paused);
  } else if (mode === "menu" && (e.code === "Enter" || e.code === "Space")) startRun(false);
});
addEventListener("keyup", e => { if (!G) return; if ((KL.includes(e.code) && G.keyDir < 0) || (KR.includes(e.code) && G.keyDir > 0)) G.keyDir = 0; });
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(true); });
$("bPlay").onclick = () => { sfx("ui"); startRun(false); };
$("bDaily").onclick = () => { sfx("ui"); startRun(true); };
$("bShop").onclick = () => { sfx("ui"); show("shop"); };
$("bQuests").onclick = () => { sfx("ui"); showQuests(); };
$("bShopBack").onclick = () => { sfx("ui"); show("menu"); };
$("bPause").onclick = () => pause(true);
$("bLang").onclick = () => { S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % 3]; save(); applyLang(); };
$("bSound").onclick = () => { S.sound = !S.sound; save(); applyLang(); sfx("ui"); };
$("bMusic").onclick = () => { S.music = !S.music; save(); applyLang(); };

// ---------- Bucla ----------
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  if (G && !window.__noLoop) {
    if (G.demo) { // pe meniu barca merge singură
      G.d += 90 * dt; genAhead(); const row = G.rows.find(r => r.y > G.d + 30); if (row) G.x += (row.gx - G.x) * Math.min(1, dt * 4);
      for (const it of G.items) if (!it.got && Math.hypot(it.x - G.x, it.y - G.d) < 24) it.got = true;
      G.parts.push({ x: G.x + (Math.random() - 0.5) * 10, y: G.d - 14, vx: 0, life: 1, kind: "wake" }); G.parts.forEach(p => p.life -= dt * 0.9); G.parts = G.parts.filter(p => p.life > 0);
      G.obs = G.obs.filter(o => o.y > G.d - 400); G.items = G.items.filter(i => i.y > G.d - 400); G.rows = G.rows.filter(r => r.y > G.d - 400);
    } else step(dt);
    if (shake > 0) shake -= dt;
  }
  if (G && mode === "play") { $("hScore").textContent = score() + " m"; $("hLan").textContent = "🏮 " + G.lan + (G.shield ? "  🪷" : ""); }
  music();
  draw(now);
  requestAnimationFrame(loop);
}
demo(); show("menu"); save();
if (showNews) setTimeout(() => toast(t("whatsNew", { v: VERSION })), 600);
requestAnimationFrame(loop);
</script>
