<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cozy Quilt</title>
<meta name="description" content="A cozy patchwork puzzle. Drag, turn and flip fabric patches to sew 60 quilts, plus a new Daily Quilt every day.">
<meta name="theme-color" content="#2b1d2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3e3cf'/%3E%3Crect x='8' y='8' width='24' height='24' rx='4' fill='%23e05d6f'/%3E%3Crect x='32' y='8' width='24' height='24' rx='4' fill='%2357a6c9'/%3E%3Crect x='8' y='32' width='24' height='24' rx='4' fill='%23f2b544'/%3E%3Crect x='32' y='32' width='24' height='24' rx='4' fill='%236dbb7a'/%3E%3C/svg%3E">
<style>
:root{--bg:#2b1d2e;--panel:rgba(48,32,50,.94);--line:rgba(255,255,255,.16);--ink:#fff8ef;--dim:#e3cfd6;--acc:#ffc95e;--acc2:#ff8f9e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:4;overflow:auto}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
button{font:inherit;color:inherit;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:rgba(255,255,255,.15)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}
button.pri{background:linear-gradient(180deg,#ffdf8f,#ffb43a);color:#3d2200;border:none;box-shadow:0 6px 0 #b8741a,0 10px 24px rgba(0,0,0,.35)}
button.pri:active{transform:translateY(4px);box-shadow:0 2px 0 #b8741a}
button.ico{padding:8px 12px;min-width:48px;min-height:46px;font-size:20px;background:rgba(30,18,32,.6);backdrop-filter:blur(4px)}
button:disabled{opacity:.4;cursor:default}
#menu{justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(30,16,30,.45),rgba(30,16,30,.86));backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}
#menu h1{margin:0 0 6px;font-size:clamp(48px,14vw,80px);line-height:.95;color:#fff4e2;text-shadow:0 5px 0 #a8475a,0 9px 0 rgba(0,0,0,.25),0 0 40px rgba(255,200,150,.35);text-align:center;font-weight:900}
#menu h1 span{display:block;font-size:.66em;color:var(--acc);text-shadow:0 4px 0 #8c5200,0 7px 0 rgba(0,0,0,.25)}
#menu .sub{color:var(--dim);margin:8px 18px 20px;text-align:center;max-width:380px;font-size:16px}
#menuInfo{color:var(--acc);margin:6px 0 4px;font-weight:700;text-align:center}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.deco{width:58px;height:58px;margin-bottom:14px;animation:bob 2.6s ease-in-out infinite;display:grid;grid-template-columns:1fr 1fr;gap:3px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.deco i{border-radius:5px;border:2px dashed rgba(255,255,255,.55)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{margin:0 0 12px;text-align:center;font-size:26px}
.top{display:flex;align-items:center;justify-content:space-between;width:min(94vw,560px);padding:14px 0 8px;position:sticky;top:0;z-index:2}
.top h2{margin:0}
#levels,#fabrics,#settings{background:linear-gradient(180deg,#2b1d2e,#1d1320)}
.world{width:min(94vw,560px);margin:8px 0 4px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.world h3{margin:0 0 10px;display:flex;justify-content:space-between;font-size:18px}
.world h3 small{color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:14px;font-weight:800;font-size:20px}
.lv small{font-size:11px;letter-spacing:1px;color:var(--acc);height:14px}
.lv.lock{opacity:.35}
.lv.cur{outline:3px solid var(--acc)}
.fabs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(94vw,520px);padding-bottom:30px}
.fb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px}
.fb .sw{display:flex;gap:3px}
.fb .sw i{width:20px;height:20px;border-radius:5px;display:block;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.fb.on{outline:3px solid var(--acc)}
.fb small{color:var(--dim);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:none}
.set button{min-width:96px}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:3;pointer-events:none}
#hud.on{display:flex}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#hud .mid b{display:block;font-size:20px}
#hud .mid small{color:var(--dim);font-size:13px}
#tools{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:10px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:3}
#tools.on{display:flex}
#tools button{min-width:56px;min-height:50px;font-size:20px;padding:6px 12px;background:rgba(30,18,32,.7)}
#tools button small{display:block;font-size:11px;color:var(--dim)}
#tools #bHint{position:relative}
#tools #bHint b{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#3d2200;border-radius:10px;font-size:12px;padding:1px 6px}
#tip{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;background:rgba(40,24,42,.92);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:15px;max-width:min(92vw,440px);text-align:center;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tip.on{display:block;animation:pop .35s ease}
#win{justify-content:center;background:rgba(20,10,20,.55)}
#win .panel{text-align:center;animation:pop .45s ease}
#win .stars{font-size:46px;letter-spacing:6px;margin:4px 0 8px;color:#6a5560}
#win .stars .s{color:var(--acc);text-shadow:0 0 18px rgba(255,200,90,.7);display:inline-block;animation:pop .4s ease both}
#win p{color:var(--dim);margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,24,42,.95);border:1px solid var(--line);border-radius:14px;padding:9px 16px;z-index:6;display:none;font-weight:700}
#toast.on{display:block;animation:pop .3s ease}
#news{margin-top:10px;font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button class="ico" id="bBack" aria-label="Menu">☰</button><div class="mid"><b id="hTitle"></b><small id="hSub"></small></div><button class="ico" id="bReset" aria-label="Restart">↺</button></div>
<div id="tools"><button id="bRot" aria-label="Rotate">↻<small data-t="rot"></small></button><button id="bFlip" aria-label="Flip">⇋<small data-t="flip"></small></button><button id="bHint" aria-label="Hint">💡<small data-t="hint"></small><b id="hintN">0</b></button></div>
<div id="tip"></div>
<div id="toast"></div>

<div class="screen on" id="menu">
  <div class="deco"><i style="background:#e05d6f"></i><i style="background:#57a6c9"></i><i style="background:#f2b544"></i><i style="background:#6dbb7a"></i></div>
  <h1>Cozy<span>Quilt</span></h1>
  <div class="sub" data-t="sub"></div>
  <button class="big pri" id="bPlay"></button>
  <button class="big" id="bDaily"></button>
  <button class="big" id="bLevels"></button>
  <div class="row"><button id="bFabrics" class="ico" aria-label="Fabrics">🧵</button><button id="bSettings" class="ico" aria-label="Settings">⚙️</button><button id="bLang" class="ico" aria-label="Language">RO</button></div>
  <div id="menuInfo"></div>
  <div id="news"></div>
</div>

<div class="screen" id="levels"><div class="top"><button class="ico" data-back aria-label="Back">←</button><h2 data-t="levels"></h2><span id="lvStars" style="min-width:48px;text-align:right;color:var(--acc);font-weight:800"></span></div><div id="worlds" style="padding-bottom:30px"></div></div>
<div class="screen" id="fabrics"><div class="top"><button class="ico" data-back aria-label="Back">←</button><h2 data-t="fabrics"></h2><span id="fbStars" style="min-width:48px;text-align:right;color:var(--acc);font-weight:800"></span></div><div class="fabs" id="fabList"></div></div>

  <div class="panel">
    <div class="set"><span data-t="sound"></span><button id="sSound"></button></div>
    <div class="set"><span data-t="music"></span><button id="sMusic"></button></div>
    <div class="set"><span data-t="vibe"></span><button id="sVibe"></button></div>
    <div class="set"><span data-t="lang"></span><button id="sLang"></button></div>
    <div class="set"><span data-t="keys"></span><small style="color:var(--dim);text-align:right">R ↻ · F ⇋ · H 💡 · Esc</small></div>
    <div class="set"><span data-t="reset"></span><button id="sReset" style="color:#ff9a9a"></button></div>
  </div></div>
<div class="screen" id="win"><div class="panel"><h2 id="wTitle"></h2><div class="stars" id="wStars"></div><p id="wInfo"></p><div class="row"><button class="ico" id="wMenu" aria-label="Levels">▦</button><button class="ico" id="wAgain" aria-label="Replay">↺</button><button class="big pri" id="wNext" style="width:auto;padding:12px 26px;margin:0"></button></div></div></div>

    tips: { drag: 'Перетащите лоскут из корзины на одеяло. Заполните все клетки!', hint: 'Застряли? 💡 Подсказка ставит один лоскут (минус звезда).', rotate: 'Нажмите на лоскут, чтобы повернуть (или ↻).', button: 'На пуговицах шить нельзя — обходите их!', flip: 'Некоторые лоскуты перевёрнуты: ⇋ отражает их.' } }
};
const LANGS = ['ro', 'en', 'ru'];
// ---------- materiale ----------
const FABRICS = [
  { id: 'gran', name: { ro: 'Bunica', en: 'Granny', ru: 'Бабушка' }, need: 0, bg: '#f3e3cf', cells: '#e4cdb2', c: ['#e05d6f', '#57a6c9', '#f2b544', '#6dbb7a', '#a678c9', '#f08a4b', '#4f7fbf', '#d8697f', '#8bb54e', '#c9a14a', '#5fb8ae', '#b85c8a'] },

];
const PATS = ['dots', 'stripes', 'gingham', 'stars', 'flowers', 'zigzag', 'plain', 'hearts', 'diag', 'checks'];
// ---------- rng ----------
function rnd(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// ---------- forme ----------
function norm(cells) { let mx = 1e9, my = 1e9; for (const [x, y] of cells) { mx = Math.min(mx, x); my = Math.min(my, y); } return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]); }
function orient(cells, r, f) { let c = cells.map(([x, y]) => [f ? -x : x, y]); for (let i = 0; i < (r & 3); i++) c = c.map(([x, y]) => [-y, x]); return norm(c); }
const key = c => c.map(p => p[0] + ',' + p[1]).join(';');
function dims(cells) { let w = 0, h = 0; for (const [x, y] of cells) { w = Math.max(w, x + 1); h = Math.max(h, y + 1); } return [w, h]; }

// ---------- generare nivele ----------
function partition(mask, w, h, rng, minK, maxK) {
  for (let att = 0; att < 400; att++) {

$('bFlip').onclick = () => { if (G && G.sel === null) G.sel = (G.pieces.find(p => p.gx === null) || {}).id ?? null; flipSel(); };
$('bHint').onclick = () => { hint(); if (G && G.tipKey === 'hint') closeTip(); };
$('wNext').onclick = () => { sfx.click(); if (G.L.daily || G.L.idx === 59) { renderLevels(); mode = 'menu'; demoStart(); show('levels'); } else startLevel(G.L.idx + 1); };
$('wAgain').onclick = () => { sfx.click(); startLevel(G.L.daily ? -1 : G.L.idx); };
$('wMenu').onclick = () => { sfx.click(); renderLevels(); mode = 'menu'; demoStart(); show('levels'); };
