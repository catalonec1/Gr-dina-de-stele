<style>

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}

  { c: '#e0505f', c2: '#f7d36b', need: 0, name: { ro: 'Cireașă', en: 'Cherry', ru: 'Вишня' } },
  { c: '#3f8fd9', c2: '#ffffff', need: 15, name: { ro: 'Fiord', en: 'Fjord', ru: 'Фьорд' } },

// ---------- logica ----------
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function rnd(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// celule: 0 gheață, 1 piatră, 2 nămete, 3 gheață crăpată
function mkLevel(w, h, cell, start, goal, fish) {
  const L = { w, h, cell, start, goal, fish, fishIdx: new Int8Array(w * h).fill(-1), crackIdx: new Int8Array(w * h).fill(-1), cracks: [] };
  fish.forEach((c, i) => L.fishIdx[c] = i);
  cell.forEach((c, i) => { if (c === 3) { L.crackIdx[i] = L.cracks.length; L.cracks.push(i); } });
  return L;

function slide(L, st, d) {
  const [dx, dy] = DIRS[d]; let x = st.p % L.w, y = (st.p / L.w) | 0, f = st.f, b = st.b, win = false; const path = [st.p];

  for (;;) {
    const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h) break;

function solve(L, st0, cap = 300000) {

    // celulele prin care se poate trece (fără pești, fără spargere)
    const T = mkLevel(P.w, P.h, cell, start, -1, []); const seen = new Set([start]), pass = new Set(); let q = [start];

  if (Math.hypot(dx, dy) > 22) d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
  else { const ox = BX + (G.st.p % G.L.w + .5) * CS, oy = BY + (((G.st.p / G.L.w) | 0) + .5) * CS, tx = ptr.x - ox, ty = ptr.y - oy; if (Math.hypot(tx, ty) < CS * .45) { ptr = null; return; } d = Math.abs(tx) > Math.abs(ty) ? (tx > 0 ? 1 : 3) : (ty > 0 ? 2 : 0); }
  ptr = null; doMove(d);
});
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { if (mode === 'game') toMenu(); else if (cur && cur !== 'menu') back(); return; }
  if (mode !== 'game') return;
  const m = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 }[k];
  if (m !== undefined) { e.preventDefault(); doMove(m); } else if (k === 'z' || k === 'backspace') undo(); else if (k === 'h') hint(); else if (k === 'r') restart();
});
// ---------- ecrane ----------
let cur = 'menu';
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); cur = id;
  const g = mode === 'game' && !id; document.getElementById('hud').classList.toggle('on', g); document.getElementById('tools').classList.toggle('on', g);
  if (!g) document.getElementById('tip').classList.remove('on');
}
function back() { if (mode === 'game') { show(null); } else toMenu(); }
function toMenu() { mode = 'menu'; startDemo(); show('menu'); texts(); }
let toastT = 0;
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }
function nextLevel() { for (let i = 0; i < 60; i++) if (!S.done[i]) return i; return 59; }
function texts() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T(e.dataset.t));
  document.getElementById('bPlay').textContent = T('play');
  document.getElementById('bDaily').textContent = '🐟 ' + T('daily') + (S.daily === dayKey() ? ' ✓' : '');
  document.getElementById('bLevels').textContent = T('levels');
  document.getElementById('bLang').textContent = S.lang.toUpperCase();
  document.getElementById('wNext').textContent = T('next');
  document.getElementById('sSound').textContent = S.sound ? T('on') : T('off');
  document.getElementById('sVibe').textContent = S.vibe ? T('on') : T('off');
  document.getElementById('sLang').textContent = S.lang.toUpperCase();
  document.getElementById('sReset').textContent = T('erase');
  menuInfo(); hud();
}
function menuInfo() { document.getElementById('menuInfo').textContent = '★ ' + totalStars() + '/180' + (S.streak ? ' · 🔥 ' + S.streak : ''); document.getElementById('news').textContent = S.seen !== VERSION ? T('news') : ''; }
function renderLevels() {
  const el = document.getElementById('worlds'); let h = ''; const nx = nextLevel();
  for (let w = 0; w < 4; w++) {
    let st = 0; for (let i = w * 15; i < w * 15 + 15; i++) st += S.stars[i] || 0;
    h += `<div class="world"><h3>${T('w')[w]}<small>★ ${st}/45</small></h3><p>${T('wsub')[w]}</p><div class="grid">`;
    for (let i = w * 15; i < w * 15 + 15; i++) { const lock = i > 0 && !S.done[i - 1] && !S.done[i]; h += `<button class="lv${lock ? ' lock' : ''}${i === nx && !S.done[i] ? ' cur' : ''}" data-lv="${i}">${i + 1}<small>${'★'.repeat(S.stars[i] || 0)}</small></button>`; }
    h += '</div></div>';
  }
  el.innerHTML = h; document.getElementById('lvStars').textContent = '★ ' + totalStars();
}
function renderSkins() {
  const t = totalStars(); document.getElementById('skStars').textContent = '★ ' + t;
  document.getElementById('skList').innerHTML = SKINS.map((s, i) => `<button class="sk${S.skin === i ? ' on' : ''}" data-sk="${i}"><i style="background:linear-gradient(90deg,${s.c} 70%,${s.c2} 70% 76%,${s.c} 76%)"></i><b>${s.name[S.lang]}</b><small>${t >= s.need ? (S.skin === i ? T('used') : T('use')) : T('unlock') + ' ★ ' + s.need}</small></button>`).join('');
}
document.getElementById('worlds').addEventListener('click', e => { const b = e.target.closest('.lv'); if (!b) return; const i = +b.dataset.lv; if (b.classList.contains('lock')) { toast(T('locked')); return; } startLevel(i); });
document.getElementById('skList').addEventListener('click', e => { const b = e.target.closest('.sk'); if (!b) return; const i = +b.dataset.sk; if (totalStars() < SKINS[i].need) { toast(T('unlock') + ' ★ ' + SKINS[i].need); return; } S.skin = i; save(); renderSkins(); });
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { show('menu'); texts(); });
const $ = id => document.getElementById(id);
$('bPlay').onclick = () => { S.seen = VERSION; save(); startLevel(nextLevel()); };
$('bDaily').onclick = () => startLevel(-1);
$('bLevels').onclick = () => { renderLevels(); show('levels'); };
$('bSkins').onclick = () => { renderSkins(); show('skins'); };
$('bSettings').onclick = () => { texts(); show('settings'); };
const cycleLang = () => { S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % 3]; save(); texts(); };
$('bLang').onclick = cycleLang; $('sLang').onclick = cycleLang;
$('sSound').onclick = () => { S.sound ^= 1; save(); texts(); };
$('sVibe').onclick = () => { S.vibe ^= 1; save(); texts(); };
let sure = 0; $('sReset').onclick = () => { if (!sure) { sure = 1; $('sReset').textContent = T('sure'); setTimeout(() => { sure = 0; texts(); }, 2500); return; } const l = S.lang; S = { lang: l, done: [], stars: [], best: [], hints: 5, skin: 0, sound: 1, vibe: 1, daily: 0, streak: 0, gift: dayKey(), tips: {}, seen: VERSION }; save(); sure = 0; texts(); };
$('bBack').onclick = toMenu; $('bReset').onclick = restart; $('bUndo').onclick = undo; $('bHint').onclick = hint;
$('wNext').onclick = () => startLevel(Math.min(59, LI + 1));
$('wAgain').onclick = () => startLevel(LI);
$('wMenu').onclick = () => { mode = 'menu'; startDemo(); renderLevels(); show('levels'); };
// ---------- pornire ----------
layout(); startDemo(); texts();
if (S.gift !== dayKey()) { const first = !S.gift; S.gift = dayKey(); if (!first) { S.hints += 2; setTimeout(() => toast(T('gift')), 600); } save(); }
requestAnimationFrame(frame);
