<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Glowcap Grove</title>
<meta name="description" content="A cozy night-forest puzzle. Tap to turn the roots and connect the old stump to every mushroom until the whole grove glows. 60 glades plus a new Daily Glade every day.">
<meta name="theme-color" content="#13241a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313241a'/%3E%3Crect x='27' y='30' width='10' height='20' rx='4' fill='%23f2e6c8'/%3E%3Cpath d='M10 34 Q32 4 54 34 Z' fill='%239cff7a'/%3E%3Ccircle cx='24' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='38' cy='20' r='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#13241a;--panel:rgba(20,40,28,.95);--line:rgba(255,255,255,.16);--ink:#f3fbef;--dim:#bfd6c2;--acc:#ffd76a;--acc2:#9cff7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:4;overflow:auto}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
button{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}
button.pri{background:linear-gradient(180deg,#d4ff9a,#7fd85a);color:#173006;border:none;box-shadow:0 6px 0 #3f8a2a,0 10px 24px rgba(0,0,0,.35)}
button.pri:active{transform:translateY(4px);box-shadow:0 2px 0 #3f8a2a}
button.ico{padding:8px 12px;min-width:48px;min-height:46px;font-size:20px;background:rgba(8,22,14,.6);backdrop-filter:blur(4px)}
#menu{justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(6,18,10,.35),rgba(6,18,10,.85));backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}
#menu h1{margin:0 0 6px;font-size:clamp(46px,13vw,78px);line-height:.95;color:#eaffdf;text-shadow:0 5px 0 #3f8a2a,0 9px 0 rgba(0,0,0,.25),0 0 40px rgba(156,255,122,.4);text-align:center;font-weight:900}
#menu h1 span{display:block;font-size:.72em;color:var(--acc);text-shadow:0 4px 0 #8c5a00,0 7px 0 rgba(0,0,0,.25)}
#menu .sub{color:var(--dim);margin:8px 18px 20px;text-align:center;max-width:380px;font-size:16px}
#menuInfo{color:var(--acc);margin:6px 0 4px;font-weight:700;text-align:center}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.deco{font-size:54px;margin-bottom:10px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(156,255,122,.6))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{margin:0 0 12px;text-align:center;font-size:26px}
.top{display:flex;align-items:center;justify-content:space-between;width:min(94vw,560px);padding:14px 0 8px;position:sticky;top:0;z-index:2}
.top h2{margin:0}
#levels,#skins,#settings{background:linear-gradient(180deg,#13241a,#0a140e)}
.world{width:min(94vw,560px);margin:8px 0 4px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.world h3{margin:0 0 10px;display:flex;justify-content:space-between;font-size:18px}
.world h3 small{color:var(--acc);font-weight:700}
.world p{margin:-6px 0 10px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:14px;font-weight:800;font-size:20px}
.lv small{font-size:11px;letter-spacing:1px;color:var(--acc);height:14px}
.lv.lock{opacity:.35}
.lv.cur{outline:3px solid var(--acc)}
.sks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(94vw,520px);padding-bottom:30px}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px}
.sk i{width:64px;height:16px;border-radius:8px;display:block}
.sk.on{outline:3px solid var(--acc)}
.sk small{color:var(--dim);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:none}
.set button{min-width:96px}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:3;pointer-events:none}
#hud.on{display:flex}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.7)}

#hud .mid small{color:var(--dim);font-size:14px}
#tools{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:12px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:3}
#tools.on{display:flex}
#tools button{min-width:64px;min-height:50px;font-size:20px;padding:6px 12px;background:rgba(8,22,14,.7)}
#tools button small{display:block;font-size:11px;color:var(--dim)}
#bHint{position:relative}
#bHint b{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#3d2200;border-radius:10px;font-size:12px;padding:1px 6px}
#tip{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;background:rgba(12,30,18,.93);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:15px;max-width:min(92vw,440px);text-align:center;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tip.on{display:block;animation:pop .35s ease}
#win{justify-content:center;background:rgba(4,12,6,.55)}
#win .panel{text-align:center;animation:pop .45s ease}
#win .stars{font-size:46px;letter-spacing:6px;margin:4px 0 8px;color:#4a5f4e}
#win .stars .s{color:var(--acc);text-shadow:0 0 18px rgba(255,215,106,.7);display:inline-block;animation:pop .4s ease both}
#win p{color:var(--dim);margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(12,30,18,.96);border:1px solid var(--line);border-radius:14px;padding:9px 16px;z-index:6;display:none;font-weight:700;text-align:center;max-width:92vw}
#toast.on{display:block;animation:pop .3s ease}
@media (max-height:700px){.deco{display:none}#menu .sub{margin:4px 18px 10px}}
#news{margin-top:10px;font-size:13px;color:var(--dim);text-align:center;padding:0 16px}
</style>
</head>

const SKINS = [
  { c: '#9cff7a', c2: '#ff8fd8', need: 0, name: { ro: 'Mușchi', en: 'Moss', ru: 'Мох' } },
  { c: '#7fe8ff', c2: '#ffc46b', need: 15, name: { ro: 'Rouă', en: 'Dew', ru: 'Роса' } },

// ---------- logica ----------
// direcții: 0 sus, 1 dreapta, 2 jos, 3 stânga; masca are bitul 1<<d pentru fiecare rădăcină
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
function rnd(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function tapsTo(cur, sol) { let m = cur; for (let t = 0; t < 4; t++) { if (m === sol) return t; m = rot(m); } return -1; }

  let x = i % L.w + DX[d], y = ((i / L.w) | 0) + DY[d];

// analiză: ce e aprins, câte capete libere, dacă e câștig
function analyze(L, m) {

    if (lab[s] >= 0) { mixed = true; lab[s] = 9; return; }
    const q = [s]; lab[s] = k; const seen = [s];

function gen(seed, P) {
  const r = rnd(seed), N = P.w * P.h; let best = null, bestSc = 1e9;

    }
    const free = []; for (let i = 0; i < N; i++) if (!L.hole[i]) free.push(i);

  const g = mode === 'game' && !id; document.getElementById('hud').classList.toggle('on', g); document.getElementById('tools').classList.toggle('on', g);
  if (!g) document.getElementById('tip').classList.remove('on');
}
function back() { if (mode === 'game') { show(null); } else toMenu(); }
function toMenu() { mode = 'menu'; startDemo(); show('menu'); texts(); }
let toastT = 0;
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }
function nextLevel() { for (let i = 0; i < 60; i++) if (!S.done[i]) return i; return 59; }
function texts() {
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T(e.dataset.t));
  document.getElementById('bPlay').textContent = T('play');
  document.getElementById('bDaily').textContent = '🍄 ' + T('daily') + (S.daily === dayKey() ? ' ✓' : '');
  document.getElementById('bLevels').textContent = T('levels');
  document.getElementById('bLang').textContent = S.lang.toUpperCase();
  document.getElementById('wNext').textContent = T('next');
  document.getElementById('sSound').textContent = S.sound ? T('on') : T('off');
  document.getElementById('sVibe').textContent = S.vibe ? T('on') : T('off');
  document.getElementById('sLang').textContent = S.lang.toUpperCase();
  document.getElementById('sReset').textContent = T('erase');
  menuInfo(); hud();
}
function menuInfo() { document.getElementById('menuInfo').textContent = '★ ' + totalStars() + '/180' + (S.streak ? ' · 🔥 ' + S.streak : ''); document.getElementById('news').textContent = S.seen !== VERSION ? T('news') : ''; }
function renderLevels() {
  const el = document.getElementById('worlds'); let h = ''; const nx = nextLevel();
  for (let w = 0; w < 4; w++) {
    let st = 0; for (let i = w * 15; i < w * 15 + 15; i++) st += S.stars[i] || 0;
    h += `<div class="world"><h3>${T('w')[w]}<small>★ ${st}/45</small></h3><p>${T('wsub')[w]}</p><div class="grid">`;
    for (let i = w * 15; i < w * 15 + 15; i++) { const lock = i > 0 && !S.done[i - 1] && !S.done[i]; h += `<button class="lv${lock ? ' lock' : ''}${i === nx && !S.done[i] ? ' cur' : ''}" data-lv="${i}">${i + 1}<small>${'★'.repeat(S.stars[i] || 0)}</small></button>`; }
    h += '</div></div>';
  }
  el.innerHTML = h; document.getElementById('lvStars').textContent = '★ ' + totalStars();
}
function renderSkins() {
  const t = totalStars(); document.getElementById('skStars').textContent = '★ ' + t;
  document.getElementById('skList').innerHTML = SKINS.map((s, i) => `<button class="sk${S.skin === i ? ' on' : ''}" data-sk="${i}"><i style="background:linear-gradient(90deg,${s.c} 55%,${s.c2} 55%);box-shadow:0 0 14px ${s.c}"></i><b>${s.name[S.lang]}</b><small>${t >= s.need ? (S.skin === i ? T('used') : T('use')) : T('unlock') + ' ★ ' + s.need}</small></button>`).join('');
}
document.getElementById('worlds').addEventListener('click', e => { const b = e.target.closest('.lv'); if (!b) return; const i = +b.dataset.lv; if (b.classList.contains('lock')) { toast(T('locked')); return; } startLevel(i); });
document.getElementById('skList').addEventListener('click', e => { const b = e.target.closest('.sk'); if (!b) return; const i = +b.dataset.sk; if (totalStars() < SKINS[i].need) { toast(T('unlock') + ' ★ ' + SKINS[i].need); return; } S.skin = i; save(); renderSkins(); });
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { show('menu'); texts(); });
const $ = id => document.getElementById(id);
$('bPlay').onclick = () => { S.seen = VERSION; save(); startLevel(nextLevel()); };
$('bDaily').onclick = () => startLevel(-1);
$('bLevels').onclick = () => { renderLevels(); show('levels'); };
$('bSkins').onclick = () => { renderSkins(); show('skins'); };
$('bSettings').onclick = () => { texts(); show('settings'); };
const cycleLang = () => { S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % 3]; save(); texts(); };
$('bLang').onclick = cycleLang; $('sLang').onclick = cycleLang;
$('sSound').onclick = () => { S.sound ^= 1; save(); texts(); };
$('sVibe').onclick = () => { S.vibe ^= 1; save(); texts(); };
let sure = 0; $('sReset').onclick = () => { if (!sure) { sure = 1; $('sReset').textContent = T('sure'); setTimeout(() => { sure = 0; texts(); }, 2500); return; } const l = S.lang; S = { lang: l, done: [], stars: [], best: [], hints: 5, skin: 0, sound: 1, vibe: 1, daily: 0, streak: 0, gift: dayKey(), tips: {}, seen: VERSION }; save(); sure = 0; texts(); };
$('bBack').onclick = toMenu; $('bReset').onclick = restart; $('bUndo').onclick = undo; $('bHint').onclick = hint;
$('wNext').onclick = () => startLevel(Math.min(59, LI + 1));
$('wAgain').onclick = () => startLevel(LI);
$('wMenu').onclick = () => { mode = 'menu'; startDemo(); renderLevels(); show('levels'); };
// ---------- pornire ----------
layout(); startDemo(); texts();
if (S.gift !== dayKey()) { const first = !S.gift; S.gift = dayKey(); if (!first) { S.hints += 2; setTimeout(() => toast(T('gift')), 600); } save(); }
requestAnimationFrame(frame);
</script>
</body>
</html>
