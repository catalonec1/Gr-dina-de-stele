# Cloudflare Worker pentru botul jocului (plan gratuit).
# Publicare: npx wrangler deploy (din folderul bot/), apoi:
#   npx wrangler secret put BOT_TOKEN
# și deschide https://<worker>/setup o singură dată (secretul webhook-ului se derivă din token).
name = "orbita-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
GAME_URL = "https://catalonec1.github.io/Gr-dina-de-stele/telegram/"
ALLOWED_ORIGIN = "https://catalonec1.github.io"
# OWNER_CHAT_ID = ""   # opțional: ID-ul tău de chat, ca să primești mesajele de suport

[[kv_namespaces]]
binding = "PURCHASES"
id = "REPLACE_WITH_KV_ID"
