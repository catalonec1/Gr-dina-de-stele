<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cocoon Garden</title>
<meta name="description" content="A cozy idle / incremental garden. Shake the old tree for leaves, raise caterpillars, ladybugs, snails and bees, ride the four seasons, catch golden butterflies and migrate for wing dust. Keeps growing while you are away.">
<meta name="theme-color" content="#2c4a2a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c4a2a'/%3E%3Cellipse cx='32' cy='36' rx='12' ry='19' fill='%23f2e6c8'/%3E%3Cpath d='M20 30h24M21 38h22M23 46h18' stroke='%23c9b48a' stroke-width='2'/%3E%3Cpath d='M32 6v11' stroke='%236b4a2e' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{--bg:#2c4a2a;--panel:rgba(26,46,26,.95);--line:rgba(255,255,255,.16);--ink:#fbfdf3;--dim:#cfe0c4;--acc:#ffd166;--acc2:#a8e06c;--pw:400px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}
button.pri{background:linear-gradient(180deg,#ffe49a,#f5b83d);color:#4a2b00;border:none;box-shadow:0 5px 0 #a86f12,0 8px 20px rgba(0,0,0,.3)}
button.pri:active{transform:translateY(3px);box-shadow:0 2px 0 #a86f12}
button.ico{padding:6px 10px;min-width:44px;min-height:42px;font-size:19px;background:rgba(14,30,14,.6)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:8;overflow:auto;background:rgba(10,22,10,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes poke{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}
#menu h1{margin:0 0 6px;font-size:clamp(46px,13vw,78px);line-height:.95;color:#f6ffe6;text-shadow:0 5px 0 #4f8f2a,0 9px 0 rgba(0,0,0,.25),0 0 40px rgba(168,224,108,.4);text-align:center;font-weight:900}
#menu h1 span{display:block;font-size:.72em;color:var(--acc);text-shadow:0 4px 0 #a86f12,0 7px 0 rgba(0,0,0,.25)}
#news{margin-top:10px;font-size:13px;color:var(--dim);text-align:center;padding:0 16px;max-width:420px}
#menu .sub{color:var(--dim);margin:8px 18px 18px;text-align:center;max-width:390px;font-size:16px}
.deco{font-size:54px;margin-bottom:8px;animation:bob 2.6s ease-in-out infinite}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .35s ease}
h2{margin:0 0 12px;text-align:center;font-size:24px}
.set{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:none}
.set button{min-width:96px}
#hud{position:fixed;left:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#leaves{font-size:28px;font-weight:900;display:block;line-height:1.1}
#rate{font-size:14px;color:#eef7e4}
#season{display:inline-block;margin-top:4px;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.3)}
#rush{display:none;margin-top:4px;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(255,209,102,.9);color:#4a2b00;font-weight:800}
#side{position:fixed;z-index:5;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
#tabs{display:flex;gap:4px;padding:6px 6px 0}
#tabs button{flex:1;padding:8px 2px;font-size:13px;border-radius:12px 12px 0 0;border-bottom:none;background:rgba(255,255,255,.05)}
#tabs button.on{background:rgba(255,255,255,.16);color:var(--acc);font-weight:800}
#buyMode{display:flex;gap:6px;padding:6px 8px;align-items:center;font-size:13px;color:var(--dim)}
#buyMode button{padding:4px 10px;font-size:13px;border-radius:10px}
#buyMode button.on{background:var(--acc);color:#4a2b00;border-color:transparent;font-weight:800}
#list{flex:1;overflow-y:auto;padding:4px 8px calc(10px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:5px 0;padding:8px 10px;border-radius:14px}
.it .e{font-size:28px;width:38px;text-align:center;flex:none}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:15px}
.it .t small{display:block;color:var(--dim);font-size:12px;line-height:1.3}
.it .c{text-align:right;font-weight:800;color:var(--acc);font-size:14px;white-space:nowrap}
.it .c small{display:block;color:var(--dim);font-weight:400;font-size:11px}
.it.no .c{color:#d99}
.it.lock{opacity:.4}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 0}
.ach div{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--line);filter:grayscale(1);opacity:.4}
.ach div.got{filter:none;opacity:1;background:rgba(255,209,102,.18)}
.note{color:var(--dim);font-size:13px;text-align:center;margin:8px 4px}
#tip{position:fixed;z-index:6;background:rgba(20,40,20,.95);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:15px;text-align:center;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateX(-50%)}
#tip.on{display:block;animation:pop .35s ease}
#tip b{color:var(--acc)}
#hand{position:fixed;z-index:7;font-size:34px;pointer-events:none;display:none;animation:poke .9s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#toast{pointer-events:none;position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(20,40,20,.97);border:1px solid var(--line);border-radius:14px;padding:9px 16px;z-index:9;display:none;font-weight:700;text-align:center;max-width:92vw}
#toast.on{display:block;animation:pop .3s ease}
@media (max-height:640px){.deco{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button class="ico" id="bMenu" aria-label="Menu">☰</button><div class="mid"><span id="leaves">0</span><span id="rate"></span><br><span id="season"></span><br><span id="rush"></span></div><button class="ico" id="bSet" aria-label="Settings">⚙️</button></div>
<div id="side">
  <div id="tabs"><button data-tab="gen" class="on"></button><button data-tab="up"></button><button data-tab="mig"></button><button data-tab="ach"></button></div>
  <div id="buyMode"><span data-t="buy"></span><button data-n="1" class="on">×1</button><button data-n="10">×10</button><button data-n="0">Max</button></div>
  <div id="list"></div>
</div>
<div id="tip"></div>
<div id="hand">👆</div>
<div id="toast"></div>

<div class="screen on" id="menu">
  <div class="deco">🦋</div>
  <h1>Cocoon<span>Garden</span></h1>
  <div class="sub" data-t="sub"></div>
  <button class="big pri" id="bPlay"></button>
  <button class="big" id="bNew" style="display:none"></button>
  <div class="row"><button id="bSettings" class="ico" aria-label="Settings">⚙️</button><button id="bLang" class="ico" aria-label="Language">RO</button></div>
  <div id="menuInfo" style="color:var(--acc);margin-top:10px;font-weight:700"></div>
  <div id="news"></div>
</div>
<div class="screen" id="settings"><div class="panelbox"><h2 data-t="settings"></h2>
  <div class="set"><span data-t="music"></span><button id="sMusic"></button></div>
  <div class="set"><span data-t="sound"></span><button id="sSound"></button></div>
  <div class="set"><span data-t="tut"></span><button id="sTut"></button></div>
  <div class="set"><span data-t="lang"></span><button id="sLang"></button></div>
  <div class="set"><span data-t="fx"></span><button id="sFx"></button></div>
  <div class="set"><span data-t="keys"></span><small style="color:var(--dim);text-align:right">Space 🌳 · 1–8 · B 🦋 · Esc</small></div>
  <div class="set"><span data-t="reset"></span><button id="sReset" style="color:#ff9a9a"></button></div>
  <div class="row"><button class="big pri" id="sClose" style="margin:0"></button></div>
</div></div>
<div class="screen" id="away"><div class="panelbox" style="text-align:center"><h2 data-t="awayT"></h2><div style="font-size:44px">🌙🍃</div><p id="awayInfo" style="color:var(--dim)"></p><button class="big pri" id="awayOk" style="margin:0 auto"></button></div></div>

    document.querySelectorAll('[data-u]').forEach(b => { const c = upCost(+b.dataset.u); b.querySelector('[data-cost]').textContent = '🍃 ' + fmt(c); b.classList.toggle('no', c > S.leaves); });
    document.querySelectorAll('[data-k]').forEach(b => { const c = CLICK_COST[S.clickUps]; b.querySelector('[data-cost]').textContent = '🍃 ' + fmt(c); b.classList.toggle('no', c > S.leaves); });
    const want = []; for (let g = 0; g < 8; g++) if (upReady(g)) want.push(g); if (want.length !== document.querySelectorAll('[data-u]').length) renderList();
  } else if (tab === 'mig') { const d = migGain(), b = $('bMig'); if (!b) return; b.disabled = !d; b.textContent = T('migNow', { d }); $('migNote').textContent = d ? '' : T('migNeed', { x: fmt(S.run) }); }
}

cv.addEventListener('pointerdown', e => {
  ac(); if (!started || cur !== null) return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, f = flyPos();

});
addEventListener('keydown', e => {
  ac(); const k = e.key.toLowerCase();

  if (!started || cur !== null) return;

  else if (k >= '1' && k <= '8') buyGen(+k - 1, buyN); else if (k === 'b') catchFly();
});

function tutUI() {
  const tp = $('tip'), hd = $('hand');
  if (!S.tut || S.step >= 3 || !started || cur !== null) { tp.classList.remove('on'); hd.style.display = 'none'; return; }
  const A = arena(), t = treeBox(); tp.innerHTML = T('steps')[S.step].replace('{n}', Math.min(10, S.clicks)); tp.classList.add('on');
  tp.style.left = (A.w / 2) + 'px'; tp.style.top = (A.h * 0.17 + 40) + 'px'; tp.style.maxWidth = Math.min(A.w - 24, 440) + 'px';
  let hx, hy; if (S.step === 0) { hx = t.x; hy = t.y - t.r * .1; } else if (S.step === 1) { const b = document.querySelector('[data-g="0"]'); if (tab !== 'gen' || !b) { tab = 'gen'; renderList(); } const r = (b || document.body).getBoundingClientRect(); hx = r.right - 50; hy = r.top + r.height * .55; } else { const f = flyPos(); if (!f) { if (!fly) spawnFly(16); } const p = flyPos(); hx = p.x; hy = p.y + 18; }
  hd.style.display = 'block'; hd.style.left = hx + 'px'; hd.style.top = hy + 'px';
}

  $('news').textContent = S.seen !== VERSION ? T('news') : '';

}

$('bLang').onclick = cycleLang; $('sLang').onclick = cycleLang;

let sure = 0; $('sReset').onclick = () => { if (!sure) { sure = 1; $('sReset').textContent = T('sure'); setTimeout(() => { sure = 0; texts(); }, 2500); return; } const l = S.lang; S = Object.assign(FRESH(), { lang: l, seen: VERSION }); crawlers = []; fly = null; started = false; sure = 0; save(); show('menu'); texts(); };
