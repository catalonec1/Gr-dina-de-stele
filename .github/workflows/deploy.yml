name: Test și publicare

on:
  push:
    branches: [main, gradina-de-stele]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Teste Grădina de stele v1.2
        run: node tests/v12.js
      - name: Teste joc Telegram
        run: node telegram/tests/run.mjs
      - name: Teste fișe gratuite (printabile)
        run: node printabile/tests/run.js
      - name: Teste Lumen Links
        run: node lumen/tests/run.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construiește versiunea web (PWA)
        run: node tools/build.js
      - name: Adaugă jocul Telegram în /telegram/
        run: |
          mkdir -p dist/web/telegram
          cp telegram/index.html telegram/config.js telegram/core.js dist/web/telegram/
      - name: Adaugă Lumen Links în /lumen/
        run: |
          mkdir -p dist/web/lumen
          cp lumen/index.html dist/web/lumen/
          cp lumen/launch/cover-630x500.png lumen/launch/icon-512.png dist/web/lumen/
      - name: Pagini SQL Pocket (politică de confidențialitate)
        run: cp -r sql-pocket dist/web/
      - name: Fișe gratuite de printat în /printabile/
        run: |
          mkdir -p dist/web/printabile
          cp printabile/index.html dist/web/printabile/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4
