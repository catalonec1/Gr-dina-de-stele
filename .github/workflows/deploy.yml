name: Test și publicare

on:
  push:
    branches: [main, gradina-de-stele]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Teste Grădina de stele v1.2
        run: node tests/v12.js
      - name: Teste Grădina de stele v1.3
        run: node tests/v13.js
      - name: Teste Grădina de stele v1.4
        run: node tests/v14.js
      - name: Teste Grădina de stele v1.5
        run: node tests/v15.js
      - name: Teste Grădina de stele v1.6
        run: node tests/v16.js
      - name: Teste joc Telegram
        run: node telegram/tests/run.mjs
      - name: Teste fișe gratuite (printabile)
        run: node printabile/tests/run.js
      - name: Teste Lumen Links
        run: node lumen/tests/run.js
      - name: Teste Lumen Links v1.1
        run: node lumen/tests/v11.js
      - name: Teste Lumen Links v1.2
        run: node lumen/tests/v12.js
      - name: Teste Lumen Links v2.0
        run: node lumen/tests/v20.js
      - name: Teste Lumen Links v2.1
        run: node lumen/tests/v21.js
      - name: Teste Lumen Links v2.2
        run: node lumen/tests/v22.js
      - name: Teste Lumen Links v2.3
        run: node lumen/tests/v23.js
      - name: Teste Paper River
        run: node river/tests/run.js
      - name: Teste Paper River v1.1
        run: node river/tests/v11.js
      - name: Teste Paper River v1.2
        run: node river/tests/v12.js
      - name: Teste Paper River v1.3
        run: node river/tests/v13.js
      - name: Teste Paper River v1.4
        run: node river/tests/v14.js
      - name: Teste Hive Bloom
        run: node hive/tests/run.js
      - name: Teste Pebble Putt
        run: node putt/tests/run.js
      - name: Teste Cozy Quilt
        run: node quilt/tests/run.js
      - name: Teste Otter Glide
        run: node glide/tests/run.js
      - name: Teste site erori ORA
        run: node ora/tests/run.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Construiește versiunea web (PWA)
        run: node tools/build.js
      - name: Adaugă jocul Telegram în /telegram/
        run: |
          mkdir -p dist/web/telegram
          cp telegram/index.html telegram/config.js telegram/core.js dist/web/telegram/
      - name: Adaugă Lumen Links în /lumen/
        run: |
          mkdir -p dist/web/lumen
          cp lumen/index.html dist/web/lumen/
          cp lumen/launch/cover-630x500.png lumen/launch/icon-512.png dist/web/lumen/
      - name: Adaugă Paper River în /river/
        run: |
          mkdir -p dist/web/river
          cp river/index.html river/launch/cover-630x500.png river/launch/icon-512.png dist/web/river/
      - name: Adaugă Hive Bloom în /hive/
        run: |
          mkdir -p dist/web/hive
          cp hive/index.html hive/launch/cover-630x500.png hive/launch/icon-512.png dist/web/hive/
      - name: Adaugă Pebble Putt în /putt/
        run: |
          mkdir -p dist/web/putt
          cp putt/index.html putt/launch/cover-630x500.png putt/launch/icon-512.png dist/web/putt/
      - name: Adaugă Cozy Quilt în /quilt/
        run: |
          mkdir -p dist/web/quilt
          cp quilt/index.html quilt/launch/cover-630x500.png quilt/launch/icon-512.png dist/web/quilt/
      - name: Adaugă Otter Glide în /glide/
        run: |
          mkdir -p dist/web/glide
          cp glide/index.html glide/launch/cover-630x500.png glide/launch/icon-512.png dist/web/glide/
      - name: Pagini SQL Pocket (politică de confidențialitate)
        run: cp -r sql-pocket dist/web/
      - name: Pagini extensii Pocket (suport + confidențialitate)
        run: cp -r extensions dist/web/
      - name: Fișe gratuite de printat în /printabile/
        run: |
          mkdir -p dist/web/printabile
          cp printabile/index.html dist/web/printabile/
      - name: Portofoliu în /portfolio/
        run: cp -r portfolio dist/web/
      - name: Site de referință erori ORA în /ora/
        run: node ora/build.js dist/web/ora
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4
