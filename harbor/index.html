<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lantern Harbor</title>
<meta name="description" content="A cozy night-harbor idle game. Tap the lighthouse to make glow, hire lamplighters, fill firefly jars, send out fishing boats, ride the tides, catch the golden ship and sail on to a new harbor. Keeps glowing while you are away.">
<meta name="theme-color" content="#0d1533">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1533'/%3E%3Ccircle cx='32' cy='18' r='12' fill='%23ffc86b' opacity='.35'/%3E%3Cpath d='M26 56l2-32h8l2 32z' fill='%23efe6d2'/%3E%3Cpath d='M27 44h10v5H27zM27.7 32h8.6v5h-8.6z' fill='%232f8f8a'/%3E%3Crect x='27' y='14' width='10' height='9' rx='2' fill='%23ffd88a'/%3E%3Cpath d='M25 14l7-6 7 6z' fill='%23233066'/%3E%3C/svg%3E">
<style>
:root{--bg:#0d1533;--panel:rgba(14,22,50,.96);--panel2:rgba(26,38,80,.9);--line:rgba(160,190,255,.16);--ink:#f4f1e6;--dim:#aab6d8;--acc:#ffc86b;--acc2:#6fe3d6;--warm:#ff9f5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font:inherit;color:inherit;background:rgba(160,190,255,.09);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s}
button:hover{background:rgba(160,190,255,.16)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:800;letter-spacing:.3px}
button.pri{background:linear-gradient(180deg,#ffdc95,#f3a43c);color:#3d1f00;border:none;box-shadow:0 5px 0 #a3600f,0 0 26px rgba(255,190,90,.35),0 10px 22px rgba(0,0,0,.4)}
button.pri:active{transform:translateY(3px);box-shadow:0 2px 0 #a3600f}
button.ico{padding:6px 10px;min-width:44px;min-height:42px;font-size:19px;background:rgba(8,14,36,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:8;overflow:auto;background:radial-gradient(ellipse at 50% 35%,rgba(20,30,70,.35),rgba(5,9,24,.78));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes poke{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,10px)}}
@keyframes shine{0%,100%{filter:drop-shadow(0 0 14px rgba(255,190,90,.55))}50%{filter:drop-shadow(0 0 26px rgba(255,190,90,.9))}}
#menu h1{margin:0 0 6px;font-size:clamp(46px,13vw,80px);line-height:.92;color:#fff4dc;text-shadow:0 4px 0 #b4621c,0 8px 0 rgba(0,0,0,.3),0 0 46px rgba(255,190,90,.55);text-align:center;font-weight:900;letter-spacing:1px}
#menu h1 span{display:block;font-size:.74em;color:var(--acc2);text-shadow:0 4px 0 #1c6a72,0 7px 0 rgba(0,0,0,.3),0 0 30px rgba(111,227,214,.45)}
#menu .sub{color:var(--dim);margin:10px 18px 18px;text-align:center;max-width:390px;font-size:16px;line-height:1.35}
.deco{width:64px;height:84px;margin-bottom:10px;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite,shine 2.4s ease-in-out infinite}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);animation:pop .35s ease}
h2{margin:0 0 12px;text-align:center;font-size:24px;color:#fff4dc}
.set{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);gap:12px;min-height:50px}
.set:last-of-type{border:none}
.set button{min-width:96px}
.set input[type=range]{width:150px;accent-color:var(--acc);cursor:pointer;height:28px}
.set .val{display:inline-block;width:38px;text-align:right;color:var(--acc);font-weight:800;font-size:14px}
#ver{color:var(--dim);font-size:12px;text-align:center;margin-top:8px;opacity:.7}
#hud{position:fixed;left:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#glow{font-size:29px;font-weight:900;display:block;line-height:1.1;color:#fff4dc}
#rate{font-size:14px;color:var(--acc)}
#phase{display:inline-block;margin-top:5px;font-size:13px;padding:3px 10px 5px;border-radius:12px;background:rgba(8,14,36,.62);border:1px solid var(--line);position:relative;overflow:hidden}
#phase i{position:absolute;left:0;bottom:0;height:2px;background:var(--acc2);border-radius:2px}
#fest{display:none;margin-top:4px;font-size:13px;padding:3px 10px;border-radius:12px;background:linear-gradient(90deg,#ffdc95,#ff9f5a);color:#3d1f00;font-weight:800;box-shadow:0 0 18px rgba(255,170,80,.6)}
#side{position:fixed;z-index:5;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
#tabs{display:flex;gap:4px;padding:6px 6px 0}
#tabs button{flex:1;padding:8px 2px;font-size:13px;border-radius:12px 12px 0 0;border-bottom:none;background:rgba(160,190,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button.on{background:var(--panel2);color:var(--acc);font-weight:800}
#buyMode{display:flex;gap:6px;padding:6px 8px;align-items:center;font-size:13px;color:var(--dim)}
#buyMode button{padding:4px 10px;font-size:13px;border-radius:10px}
#buyMode button.on{background:var(--acc);color:#3d1f00;border-color:transparent;font-weight:800}
#list{flex:1;overflow-y:auto;padding:4px 8px calc(10px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y}
.it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:5px 0;padding:7px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(40,56,108,.55),rgba(24,34,72,.55))}
.it .e{font-size:25px;width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(255,200,107,.35),rgba(255,200,107,.04) 70%);box-shadow:inset 0 0 0 1px rgba(255,200,107,.25)}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:15px}
.it .t small{display:block;color:var(--dim);font-size:12px;line-height:1.3}
.it .c{text-align:right;font-weight:800;color:var(--acc);font-size:14px;white-space:nowrap}
.it .c small{display:block;color:var(--dim);font-weight:400;font-size:11px}
.it.no .c{color:#e9a0a0}
.it.no .e{filter:saturate(.5)}
.it.hot{box-shadow:0 0 0 1px rgba(111,227,214,.5),0 0 14px rgba(111,227,214,.2)}
.it.lock{opacity:.4}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 0}
.ach div{aspect-ratio:1;border-radius:14px;background:rgba(160,190,255,.06);display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid var(--line);filter:grayscale(1);opacity:.35}
.ach div.got{filter:none;opacity:1;background:radial-gradient(circle,rgba(255,200,107,.25),rgba(255,200,107,.06));border-color:rgba(255,200,107,.4)}
.note{color:var(--dim);font-size:13px;text-align:center;margin:8px 4px}
#tip{position:fixed;z-index:6;background:rgba(12,20,46,.96);border:1px solid rgba(255,200,107,.4);border-radius:14px;padding:9px 14px;font-size:15px;text-align:center;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 20px rgba(255,200,107,.15);transform:translateX(-50%)}
#tip.on{display:block;animation:pop .35s ease}
#tip b{color:var(--acc)}
#hand{position:fixed;z-index:7;font-size:34px;pointer-events:none;display:none;animation:poke .9s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
#toast{pointer-events:none;position:fixed;left:50%;top:calc(112px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(12,20,46,.97);border:1px solid rgba(255,200,107,.45);border-radius:14px;padding:9px 16px;z-index:9;display:none;font-weight:700;text-align:center;max-width:92vw;box-shadow:0 0 22px rgba(255,200,107,.2)}
#toast.on{display:block;animation:pop .3s ease}
@media (max-height:640px){.deco{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button class="ico" id="bMenu" aria-label="Menu">☰</button><div class="mid"><span id="glow">0</span><span id="rate"></span><br><span id="phase"></span><br><span id="fest"></span></div><button class="ico" id="bSet" aria-label="Settings">⚙️</button></div>

<div id="tip"></div>

<div id="toast"></div>
