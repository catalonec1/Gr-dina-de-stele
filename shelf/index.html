<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spice Shelf</title>
<meta name="description" content="A cozy sorting puzzle in grandma's pantry. Move the spice jars between shelves until every spice has a shelf of its own. 60 levels in 4 kitchens, a Daily Pantry, symbols on every jar.">
<meta name="theme-color" content="#3b2516">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b2516'/%3E%3Crect x='6' y='50' width='52' height='7' rx='3' fill='%23c98a4f'/%3E%3Crect x='12' y='22' width='18' height='28' rx='6' fill='%23d8432f'/%3E%3Crect x='14' y='16' width='14' height='7' rx='2' fill='%23e8c36a'/%3E%3Crect x='34' y='22' width='18' height='28' rx='6' fill='%23f2b705'/%3E%3Crect x='36' y='16' width='14' height='7' rx='2' fill='%23e8c36a'/%3E%3Crect x='15' y='31' width='12' height='10' rx='2' fill='%23fffaf0'/%3E%3Crect x='37' y='31' width='12' height='10' rx='2' fill='%23fffaf0'/%3E%3C/svg%3E">
<style>
:root{--bg:#3b2516;--panel:rgba(62,38,22,.97);--line:rgba(255,235,205,.2);--ink:#fff6e6;--dim:#ecd6b8;--acc:#ffcf6e;--acc2:#e8734a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:4;overflow:auto}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes poke{0%,100%{transform:translate(-30%,0) scale(1)}50%{transform:translate(-30%,14px) scale(.9)}}
button{font:inherit;color:inherit;background:rgba(255,240,220,.1);border:1px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:rgba(255,240,220,.17)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}
button.pri{background:linear-gradient(180deg,#ffe2a0,#f0a948);color:#4a2400;border:none;box-shadow:0 6px 0 #a5611f,0 10px 24px rgba(0,0,0,.35)}
button.pri:active{transform:translateY(4px);box-shadow:0 2px 0 #a5611f}
button.ico{padding:8px 12px;min-width:48px;min-height:46px;font-size:20px;background:rgba(40,22,10,.72);backdrop-filter:blur(4px)}
#menu{justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(40,22,10,.35),rgba(30,16,8,.86));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#menu h1{margin:0 0 6px;font-size:clamp(50px,14vw,84px);line-height:.92;color:#fff3dc;text-shadow:0 5px 0 #b5562c,0 9px 0 rgba(0,0,0,.28),0 0 40px rgba(255,190,110,.35);text-align:center;font-weight:900;letter-spacing:1px}
#menu h1 span{display:block;font-size:.8em;color:var(--acc);text-shadow:0 4px 0 #a5611f,0 7px 0 rgba(0,0,0,.25)}
#menu .sub{color:var(--dim);margin:10px 18px 18px;text-align:center;max-width:380px;font-size:15.5px;line-height:1.35}
#menuInfo{color:var(--acc);margin:8px 0 4px;font-weight:700;text-align:center}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.deco{margin-bottom:6px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{margin:0 0 12px;text-align:center;font-size:26px}
.top{display:flex;align-items:center;justify-content:space-between;width:min(94vw,560px);padding:14px 0 8px;position:sticky;top:0;z-index:2}
.top h2{margin:0}
#levels,#styles,#settings{background:linear-gradient(180deg,#4a2e1b,#24140a)}
.world{width:min(94vw,560px);margin:8px 0 4px;padding:12px 14px;border-radius:18px;background:rgba(255,240,220,.06);border:1px solid var(--line)}
.world h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;font-size:18px;gap:8px}
.world h3 i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.4)}
.world h3 small{color:var(--acc);font-weight:700;white-space:nowrap}
.world p{margin:-6px 0 10px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:14px;font-weight:800;font-size:20px}
.lv small{font-size:11px;letter-spacing:1px;color:var(--acc);height:14px}
.lv.lock{opacity:.35}
.lv.cur{outline:3px solid var(--acc)}
.sts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(94vw,520px);padding-bottom:30px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px}
.st canvas{width:132px;height:66px}
.st.on{outline:3px solid var(--acc)}
.st.lock canvas{opacity:.45;filter:grayscale(.6)}
.st small{color:var(--dim);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:none}
.set button{min-width:96px;padding:10px 14px}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:3;pointer-events:none}
#hud.on{display:flex}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;background:rgba(40,22,10,.66);border-radius:14px;padding:5px 14px;backdrop-filter:blur(4px)}
#hud .mid b{display:block;font-size:18px}
#hud .mid small{color:var(--dim);font-size:13.5px}
#tools{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;gap:12px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:3}
#tools.on{display:flex}
#tools button{min-width:76px;min-height:54px;font-size:21px;padding:6px 12px;background:rgba(40,22,10,.8);position:relative}
#tools button small{display:block;font-size:11.5px;color:var(--dim)}
#tools button b{position:absolute;top:-6px;right:-6px;background:var(--acc);color:#3d2000;border-radius:10px;font-size:12px;padding:1px 6px}
#tip{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;background:rgba(48,28,14,.95);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14.5px;width:max-content;max-width:min(94vw,460px);text-align:center;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);line-height:1.3}
#tip.on{display:block;animation:pop .35s ease}
#tip b{color:var(--acc)}
#hand{position:fixed;z-index:3;font-size:36px;pointer-events:none;display:none;animation:poke .9s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#win,#pause{justify-content:center;background:rgba(30,16,8,.55)}
#win .panel,#pause .panel{text-align:center;animation:pop .45s ease}
#pause .panel{display:flex;flex-direction:column;align-items:center}
#win .stars{font-size:46px;letter-spacing:6px;margin:4px 0 8px;color:#6b5240}
#win .stars .s{color:var(--acc);text-shadow:0 0 18px rgba(255,207,110,.7);display:inline-block;animation:pop .4s ease both}
#win p{color:var(--dim);margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(48,28,14,.97);border:1px solid var(--line);border-radius:14px;padding:9px 16px;z-index:6;display:none;font-weight:700;text-align:center;width:max-content;max-width:92vw}
#toast.on{display:block;animation:pop .3s ease}
#news{margin-top:10px;font-size:13px;color:var(--dim);text-align:center;padding:0 16px}
@media (max-height:700px){.deco{display:none}#menu .sub{margin:4px 18px 10px}}
</style>
</head>

<canvas id="c"></canvas>
