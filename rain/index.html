<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rain Garden</title>
<meta name="description" content="A cozy tile-turning puzzle on a rainy hillside. Turn the carved garden stones so rainwater from the cloud spring reaches every thirsty flower and watch them bloom. 60 gardens, a Daily Garden, no timer.">
<meta name="theme-color" content="#2c4a4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c4a4f'/%3E%3Cpath d='M32 10C24 22 20 28 20 35a12 12 0 0 0 24 0c0-7-4-13-12-25z' fill='%2358c4ec'/%3E%3Ccircle cx='32' cy='50' r='6' fill='%23ff9cb8'/%3E%3Ccircle cx='32' cy='50' r='2.5' fill='%23ffd27a'/%3E%3C/svg%3E">
<style>
:root{--bg:#2c4a4f;--panel:rgba(28,50,54,.96);--line:rgba(255,255,255,.18);--ink:#f2f8f6;--dim:#c6dbd8;--acc:#ffd27a;--acc2:#8fd6e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:4;overflow:auto}
.screen.on{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes drip{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes poke{0%,100%{transform:translate(-50%,-10%) scale(1)}50%{transform:translate(-50%,10%) scale(.9)}}
button{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:rgba(255,255,255,.17)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}
button.pri{background:linear-gradient(180deg,#bdf0f8,#5cbcd8);color:#0d3441;border:none;box-shadow:0 6px 0 #2f8098,0 10px 24px rgba(0,0,0,.35)}
button.pri:active{transform:translateY(4px);box-shadow:0 2px 0 #2f8098}
button.ico{padding:8px 12px;min-width:48px;min-height:46px;font-size:20px;background:rgba(16,34,38,.62);backdrop-filter:blur(4px)}
#menu{justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(16,34,38,.3),rgba(16,34,38,.84));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#menu h1{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(50px,14vw,82px);line-height:.92;color:#eefaff;text-shadow:0 4px 0 #3b8aa3,0 8px 0 rgba(0,0,0,.25),0 0 40px rgba(143,214,232,.45);text-align:center;font-weight:700;font-style:italic}
#menu h1 span{display:block;font-size:.8em;color:#ffb8cb;text-shadow:0 4px 0 #a8506e,0 7px 0 rgba(0,0,0,.25)}
#menu .sub{color:var(--dim);margin:10px 18px 20px;text-align:center;max-width:380px;font-size:16px;line-height:1.35}
#menuInfo{color:var(--acc);margin:6px 0 4px;font-weight:700;text-align:center}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.deco{font-size:50px;margin-bottom:8px;animation:drip 2.8s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(143,214,232,.6))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{margin:0 0 12px;text-align:center;font-size:26px;font-family:Georgia,serif}
.top{display:flex;align-items:center;justify-content:space-between;width:min(94vw,560px);padding:14px 0 8px;position:sticky;top:0;z-index:2}
.top h2{margin:0}
#levels,#flowers,#settings{background:linear-gradient(180deg,#2c4a4f,#18302f)}
.world{width:min(94vw,560px);margin:8px 0 4px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.world h3{margin:0 0 10px;display:flex;justify-content:space-between;font-size:18px}
.world h3 small{color:var(--acc);font-weight:700}
.world p{margin:-6px 0 10px;color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:14px;font-weight:800;font-size:20px}
.lv small{font-size:11px;letter-spacing:1px;color:var(--acc);height:14px}
.lv.lock{opacity:.35}
.lv.cur{outline:3px solid var(--acc2)}
.sks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(94vw,520px);padding-bottom:30px}
.sk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 12px}
.sk canvas{width:84px;height:84px}
.sk.on{outline:3px solid var(--acc)}
.sk.lock canvas{filter:grayscale(1) brightness(.7)}
.sk small{color:var(--dim);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:none}
.set button{min-width:96px}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:3;pointer-events:none}
#hud.on{display:flex}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#hud .mid b{display:block;font-size:20px}
#hud .mid small{color:var(--dim);font-size:14px}

#tools.on{display:flex}
#tools button{min-width:64px;min-height:50px;font-size:20px;padding:6px 12px;background:rgba(16,34,38,.72)}

#bHint{position:relative}

#tip{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;background:rgba(22,44,48,.95);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:15px;max-width:min(92vw,440px);width:max-content;text-align:center;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}

#hand{position:fixed;z-index:3;font-size:34px;pointer-events:none;display:none;animation:poke .9s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
#win{justify-content:center;background:rgba(12,26,30,.45)}
#win .panel{text-align:center;animation:pop .45s ease}
#win .stars{font-size:46px;letter-spacing:6px;margin:4px 0 8px;color:#4a6264}
#win .stars .s{color:var(--acc);text-shadow:0 0 18px rgba(255,210,122,.7);display:inline-block;animation:pop .4s ease both}
#win p{color:var(--dim);margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(22,44,48,.97);border:1px solid var(--line);border-radius:14px;padding:9px 16px;z-index:6;display:none;font-weight:700;text-align:center;max-width:92vw}
#toast.on{display:block;animation:pop .3s ease}
@media (max-height:700px){.deco{display:none}#menu .sub{margin:4px 18px 10px}}
#news{margin-top:10px;font-size:13px;color:var(--dim);text-align:center;padding:0 16px}
</style>
</head>

};

// direcții: 0 sus, 1 dreapta, 2 jos, 3 stânga; masca: bitul d = deschidere spre d
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], OPP = d => (d + 2) & 3;
const EMPTY = 0, CH = 1, SPR = 2, FLW = 3, ROCK = 4, POND = 5;
function rnd(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function rotMask(m, k) { k &= 3; while (k--) m = rot1(m); return m; }

  L.two = L.springs.some(s => L.col[s] === 1);
  if (!L.fix) L.fix = new Uint8Array(N);
  return L;

    for (let i = w * 15; i < w * 15 + 15; i++) { const lock = i > 0 && !S.done[i - 1] && !S.done[i]; h += `<button class="lv${lock ? ' lock' : ''}${i === nx && !S.done[i] ? ' cur' : ''}" data-lv="${i}">${i + 1}<small>${'★'.repeat(S.stars[i] || 0)}</small></button>`; }
    h += '</div></div>';
  }
  el.innerHTML = h; $('lvStars').textContent = '★ ' + totalStars();
}
function renderFlowers() {
  const t = totalStars(); $('flStars').textContent = '★ ' + t;
  $('flList').innerHTML = SPECIES.map((s, i) => `<button class="sk${S.flower === i ? ' on' : ''}${t < s.need ? ' lock' : ''}" data-fl="${i}"><canvas width="168" height="168"></canvas><b>${s.name[S.lang]}</b><small>${t >= s.need ? (S.flower === i ? T('used') : T('use')) : T('unlock') + ' ★ ' + s.need}</small></button>`).join('');
  $('flList').querySelectorAll('canvas').forEach((c, i) => { const g = c.getContext('2d'); g.fillStyle = '#4a3423'; g.beginPath(); g.ellipse(84, 140, 46, 14, 0, 0, 6.28); g.fill(); drawFlower(g, 84, 86, 170, SPECIES[i], 1, 0, 0); });
}
$('worlds').addEventListener('click', e => { const b = e.target.closest('.lv'); if (!b) return; const i = +b.dataset.lv; if (b.classList.contains('lock')) { toast(T('locked')); return; } startLevel(i); });
$('flList').addEventListener('click', e => { const b = e.target.closest('.sk'); if (!b) return; const i = +b.dataset.fl; if (totalStars() < SPECIES[i].need) { toast(T('unlock') + ' ★ ' + SPECIES[i].need); return; } S.flower = i; save(); renderFlowers(); });
document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { show('menu'); texts(); });
$('bPlay').onclick = () => { S.seen = VERSION; save(); startLevel(nextLevel()); };
$('bDaily').onclick = () => startLevel(-1);
$('bLevels').onclick = () => { renderLevels(); show('levels'); };
$('bFlowers').onclick = () => { renderFlowers(); show('flowers'); };
$('bSettings').onclick = () => { texts(); show('settings'); };
const cycleLang = () => { S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % 3]; save(); texts(); };
$('bLang').onclick = cycleLang; $('sLang').onclick = cycleLang;
$('sMusic').onclick = () => { S.music ^= 1; save(); texts(); };
$('sRain').onclick = () => { S.rain ^= 1; save(); rainVol(); texts(); };
$('sSound').onclick = () => { S.sound ^= 1; save(); texts(); };
$('sVibe').onclick = () => { S.vibe ^= 1; save(); texts(); };
$('sTut').onclick = () => { S.tut ^= 1; if (S.tut) S.tips = {}; save(); texts(); };
let sure = 0; $('sReset').onclick = () => { if (!sure) { sure = 1; $('sReset').textContent = T('sure'); setTimeout(() => { sure = 0; texts(); }, 2500); return; } const l = S.lang; S = Object.assign(FRESH(), { lang: l, gift: dayKey(), seen: VERSION }); save(); sure = 0; texts(); };
$('bBack').onclick = toMenu; $('bReset').onclick = restart; $('bUndo').onclick = undo; $('bHint').onclick = hint;
$('wNext').onclick = () => startLevel(Math.min(59, LI + 1));
$('wAgain').onclick = () => startLevel(LI);
$('wMenu').onclick = () => { mode = 'menu'; startDemo(); renderLevels(); show('levels'); };
// ---------- pornire ----------
layout(); startDemo(); texts();
if (S.gift !== dayKey()) { const first = !S.gift; S.gift = dayKey(); if (!first) { S.hints += 2; setTimeout(() => toast(T('gift')), 600); } save(); }
requestAnimationFrame(frame);
</script>
