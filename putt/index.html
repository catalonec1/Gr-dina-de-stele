<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pebble Putt</title>
<meta name="description" content="A cozy minigolf puzzle. Pull back, aim and sink the pebble in 40 handmade holes across a meadow, desert dunes, a moonlit garden and a frozen pond.">
<meta name="theme-color" content="#123522">

<style>
:root{--bg:#0f2a18;--panel:rgba(16,34,22,.92);--line:rgba(255,255,255,.16);--ink:#fbfff4;--dim:#c9dcc2;--acc:#ffd75e;--acc2:#7fe08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:4;overflow:auto}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
button{font:inherit;color:inherit;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:12px 18px;cursor:pointer;transition:transform .08s,background .15s}
button:hover{background:rgba(255,255,255,.14)}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.big{font-size:21px;padding:15px 0;width:min(80vw,310px);margin:6px 0;font-weight:700}
button.pri{background:linear-gradient(180deg,#ffe98f,#ffbf2e);color:#3b2500;border:none;box-shadow:0 6px 0 #b9790f,0 10px 24px rgba(0,0,0,.35)}
button.pri:active{transform:translateY(4px);box-shadow:0 2px 0 #b9790f}
button.ico{padding:8px 12px;min-width:48px;min-height:46px;font-size:20px;background:rgba(10,24,14,.55);backdrop-filter:blur(4px)}
button:disabled{opacity:.4;cursor:default}
#menu{justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(6,18,10,.5),rgba(6,18,10,.85));backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}
#menu h1{margin:0 0 6px;font-size:clamp(46px,13vw,76px);line-height:1;letter-spacing:1px;color:#fffbe6;text-shadow:0 5px 0 #2d6b33,0 9px 0 rgba(0,0,0,.25),0 0 40px rgba(255,236,150,.35);text-align:center;font-weight:900}
#menu h1 span{display:block;font-size:.62em;color:var(--acc);text-shadow:0 4px 0 #8c5a00,0 7px 0 rgba(0,0,0,.25)}
#menu .sub{color:var(--dim);margin:8px 18px 22px;text-align:center;max-width:380px;font-size:16px}
#menuInfo{color:var(--acc);margin:6px 0 4px;font-weight:700}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.ball-deco{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e6e9e2 55%,#a9b0a4);box-shadow:0 10px 18px rgba(0,0,0,.4);margin-bottom:14px;animation:bob 2.4s ease-in-out infinite}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;width:min(92vw,430px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
h2{margin:0 0 12px;text-align:center;font-size:26px}
.top{display:flex;align-items:center;justify-content:space-between;width:min(94vw,560px);padding:14px 0 8px;position:sticky;top:0}
.top h2{margin:0}
#levels,#skins,#settings{background:linear-gradient(180deg,#0f2a18,#0a1d11)}
.world{width:min(94vw,560px);margin:8px 0 4px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.world h3{margin:0 0 10px;display:flex;justify-content:space-between;font-size:18px}
.world h3 small{color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border-radius:14px;font-weight:800;font-size:20px}
.lv small{font-size:11px;letter-spacing:1px;color:var(--acc);height:14px}
.lv.lock{opacity:.35}
.lv.cur{outline:3px solid var(--acc)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(94vw,520px);padding-bottom:30px}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px}
.sk i{width:40px;height:40px;border-radius:50%;display:block;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.sk.on{outline:3px solid var(--acc)}
.sk small{color:var(--dim);font-size:12px}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);gap:12px}
.set:last-child{border:none}
.set button{min-width:96px}
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;z-index:3;pointer-events:none}
#hud.on{display:flex}
#hud button{pointer-events:auto}
#hud .mid{text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#hud .lvn{font-weight:900;font-size:20px}
#hud .str{font-size:15px;color:var(--dim);margin-top:2px}
#hud .str b{color:var(--acc);font-size:17px}
#hud .btns{display:flex;gap:8px}
#skip{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;display:none;font-size:15px;background:rgba(10,24,14,.7)}
#skip.on{display:block}
#tip{pointer-events:none;position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(8,20,12,.88);border:1px solid rgba(255,215,94,.45);padding:11px 16px;border-radius:16px;text-align:center;z-index:3;display:none;width:max-content;max-width:88vw;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#tip.on{display:block;animation:pop .35s ease}
#tip b{color:var(--acc)}
#win,#pause{justify-content:center;background:rgba(4,12,7,.55);backdrop-filter:blur(3px)}
#win .panel,#pause .panel{animation:pop .4s ease;text-align:center}
#win .ttl{font-size:34px;font-weight:900;color:var(--acc);text-shadow:0 3px 0 #7a4b00;margin:2px 0 4px}
#win .det{color:var(--dim);margin-bottom:8px}
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 10px;font-size:46px}
.stars span{filter:grayscale(1) brightness(.5);transform:scale(.7);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.stars span.on{filter:none;transform:scale(1)}
#win .unl{color:var(--acc2);font-weight:700;min-height:20px;margin-bottom:6px}
.col{display:flex;flex-direction:column;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;background:rgba(8,20,12,.92);border:1px solid var(--line);padding:10px 16px;border-radius:14px;display:none}
#toast.on{display:block;animation:pop .3s ease}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen on">
  <div class="ball-deco"></div>
  <h1>Pebble<span>Putt</span></h1>
  <div class="sub" data-t="tag"></div>
  <div id="menuInfo"></div>
  <button id="bPlay" class="big pri" data-t="play"></button>
  <button id="bLevels" class="big" data-t="levels"></button>
  <div class="row">
    <button id="bSkins" class="ico" title="Skins">🎨</button>
    <button id="bSettings" class="ico" title="Settings">⚙️</button>
    <button id="bLang" class="ico" title="Language">🌐</button>
  </div>
</div>

<div id="levels" class="screen">
  <div class="top"><button class="ico" data-back>←</button><h2 data-t="levels"></h2><span id="lvStars" style="min-width:48px;text-align:right;color:var(--acc);font-weight:800"></span></div>
  <div id="lvList" style="padding-bottom:30px"></div>
</div>

<div id="skins" class="screen">
  <div class="top"><button class="ico" data-back>←</button><h2 data-t="skins"></h2><span id="skStars" style="min-width:48px;text-align:right;color:var(--acc);font-weight:800"></span></div>
  <div id="skList" class="skins"></div>
</div>

<div id="settings" class="screen">
  <div class="top"><button class="ico" data-back>←</button><h2 data-t="settings"></h2><span style="min-width:48px"></span></div>
  <div class="panel">
    <div class="set"><span data-t="sound"></span><button id="sSound"></button></div>
    <div class="set"><span data-t="music"></span><button id="sMusic"></button></div>
    <div class="set"><span data-t="vibe"></span><button id="sVibe"></button></div>
    <div class="set"><span data-t="guide"></span><button id="sGuide"></button></div>
    <div class="set"><span data-t="lang"></span><button id="sLang"></button></div>
    <div class="set"><span data-t="reset"></span><button id="sReset"></button></div>
  </div>
  <p style="color:var(--dim);font-size:13px;max-width:420px;text-align:center;padding:0 16px" data-t="keys"></p>
</div>

<div id="hud">
  <button id="hPause" class="ico" title="Pause">⏸</button>
  <div class="mid"><div class="lvn" id="hLv"></div><div class="str" id="hStr"></div></div>
  <div class="btns"><button id="hRetry" class="ico" title="Restart">↺</button></div>
</div>
<button id="skip" data-t="skip"></button>
<div id="tip"></div>

<div id="pause" class="screen">
  <div class="panel col">
    <h2 data-t="paused"></h2>
    <button id="pResume" class="big pri" data-t="resume"></button>
    <button id="pRetry" class="big" data-t="retry"></button>
    <button id="pLevels" class="big" data-t="levels"></button>
    <button id="pMenu" class="big" data-t="menu"></button>
  </div>
</div>

<div id="win" class="screen">
  <div class="panel col">
    <div class="ttl" id="wTtl"></div>
    <div class="det" id="wDet"></div>
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="unl" id="wUnl"></div>
    <button id="wNext" class="big pri" data-t="next"></button>
    <div class="row" style="margin-top:4px">
      <button id="wRetry" data-t="retry"></button>
      <button id="wLevels" data-t="levels"></button>
    </div>
  </div>
</div>
<div id="toast"></div>

      if (e[0] === 'wall') { SFX.wall(e[1]); if (e[1] > 40) burst(B.x, B.y, 4, 'rgba(255,255,255,.7)', 14, 0.25); }
      else if (e[0] === 'bump') { SFX.bump(); G.flash[e[1]] = 1; shake = 5; buzz(18); burst(B.x, B.y, 10, ['#fff', '#ff8a8a'], 30, 0.4); }
      else if (e[0] === 'boost') { SFX.boost(); burst(B.x, B.y, 12, ['#ffcf6b', '#fff'], 26, 0.4); }
      else if (e[0] === 'portal') { SFX.portal(); burst(CUR.portal[e[1]][0], CUR.portal[e[1]][1], 14, '#4fb8ff', 22, 0.5); burst(B.x, B.y, 14, '#ffa53d', 22, 0.5); G.trail = []; }
      else if (e[0] === 'splash') { SFX.splash(); buzz(30); burst(B.x, B.y, 26, ['#bfe9ff', '#fff', '#5bb8f0'], 28, 0.7, { s: 0.7 }); G.splashT = 0.0001; }
      else if (e[0] === 'sink') { SFX.sink(); buzz([20, 40, 30]); G.sinkT = 0.0001; G.over = true; }
    });
    for (var i = 0; i < CUR.sand.length; i++) if (inRect(B.x, B.y, CUR.sand[i]) && Math.random() < 0.35 && Math.hypot(B.vx, B.vy) > 15) burst(B.x, B.y, 1, 'rgba(200,160,90,.8)', 10, 0.4);
  } else if (G.trail.length) G.trail.shift();
  if (G.splashT > 0) {
    G.splashT += dt;
    if (G.splashT > 0.9) { B.splash = false; B.x = G.last[0]; B.y = G.last[1]; B.vx = B.vy = 0; G.strokes++; G.splashT = 0; G.trail = []; hud(); burst(B.x, B.y, 10, 'rgba(255,255,255,.8)', 12, 0.4); toast('+1'); }
  }
  if (G.sinkT > 0) {
    G.sinkT += dt; G.overT += dt;
    if (G.sinkT > 0.25 && !G.conf) { G.conf = true; var h = CUR.L.hole; burst(h[0], h[1] - 4, 50, ['#ffd75e', '#ff6b8a', '#7fe08a', '#6bc8ff', '#fff'], 45, 1.4, { g: 50, s: 1.1, sq: true }); }
    if (G.sinkT > 1.25 && !G.won) { G.won = true; finish(false); }
  }
  if (!B.moving && !G.over) G.idle += dt;
  if (G.hand) handAnim();
}
// fundal de meniu: un traseu adevărat cu o pietricică ce se joacă singură
function menuDemo() {
  LI = 8; CUR = compile(LEVELS[LI]); floorCache = null; parts = [];
  G = { ball: newBall(50, 148), last: [50, 148], strokes: 0, aim: null, trail: [], flash: [], over: false, overT: 0, sinkT: 0, splashT: 0, idle: 0, acc: 0, demo: true, wait: 0.8 };
}
function demo(dt) {
  if (!G || !G.demo) return; var B = G.ball;
  if (!B.moving) { G.wait -= dt; if (G.wait <= 0) { var h = CUR.L.hole, a = Math.atan2(h[1] - B.y, h[0] - B.x) + (Math.random() - 0.5) * 1.1; B.vx = Math.cos(a) * (70 + Math.random() * 70); B.vy = Math.sin(a) * (70 + Math.random() * 70); B.moving = true; G.wait = 1.4; } }
  if (B.sunk || G.sinkT > 0) { G.sinkT += dt; if (G.sinkT > 1.2) menuDemo(); return; }
  G.acc += Math.min(dt, 0.05); var ev = [];
  while (G.acc >= DT && B.moving) { G.acc -= DT; step(CUR, B, ev); }
  if (B.sunk) G.sinkT = 0.0001;
  ev.forEach(function (e) { if (e[0] === 'bump') { G.flash[e[1]] = 1; burst(B.x, B.y, 8, ['#fff', '#ff8a8a'], 26, 0.4); } });
  G.trail.push([B.x, B.y]); if (G.trail.length > 22 || !B.moving) G.trail.shift();
}
function rating(s, p) { var n = t('names'); if (s === 1) return n.ace; if (s <= p - 2) return n.eagle; if (s === p - 1) return n.birdie; if (s === p) return n.par; if (s === p + 1) return n.bogey; return n.more; }
function starsFor(s, p) { return s <= p ? 3 : s === p + 1 ? 2 : 1; }
function finish(skipped) {
  var p = CUR.L.par, st = skipped ? 0 : starsFor(G.strokes, p), before = totalStars();
  S.done[LI] = 1; if ((S.stars[LI] || 0) < st) S.stars[LI] = st; if (!skipped && (!S.best[LI] || G.strokes < S.best[LI])) S.best[LI] = G.strokes;
  save(); var after = totalStars();
  if (skipped) { next(); return; }
  document.getElementById('wTtl').textContent = rating(G.strokes, p);
  document.getElementById('wDet').textContent = t('det')(G.strokes, p);
  var unl = ''; SKINS.forEach(function (s, i) { if (s.need > before && s.need <= after) unl = t('unl')(t('skinNames')[i]); });
  document.getElementById('wUnl').textContent = LI === LEVELS.length - 1 ? t('allDone') : unl;
  var sp = document.querySelectorAll('#win .stars span'); sp.forEach(function (e) { e.classList.remove('on'); });
  show('win', true);
  for (var i = 0; i < st; i++) (function (k) { setTimeout(function () { sp[k].classList.add('on'); SFX.star(k); }, 350 + k * 260); })(i);
  document.getElementById('wNext').style.display = LI < LEVELS.length - 1 ? '' : 'none';
}
function next() { if (LI < LEVELS.length - 1) startLevel(LI + 1); else show('levels'); }

// ---------- intrare ----------
var drag = null;
function toWorld(cx, cy) { return [(cx - OX) / SC, (cy - OY) / SC]; }
function aimFrom(d) { var dx = d.x0 - d.x, dy = d.y0 - d.y, l = Math.hypot(dx, dy), max = Math.max(110, SC * 48); return { ang: Math.atan2(dy, dx), pow: Math.min(1, Math.max(0, (l - 8) / max)) }; }
cv.addEventListener('pointerdown', function (e) {
  startAudio(); if (mode !== 'game' || !G || G.ball.moving || G.over || G.ball.splash) return;
  drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId }; G.aim = null; try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});
cv.addEventListener('pointermove', function (e) { if (!drag || e.pointerId !== drag.id) return; drag.x = e.clientX; drag.y = e.clientY; var a = aimFrom(drag); G.aim = a.pow > 0.02 ? a : null; G.idle = 0; });
function endDrag(e) { if (!drag || (e && e.pointerId !== drag.id)) return; var a = aimFrom(drag); drag = null; if (G.aim && a.pow > 0.04) shoot(a.ang, a.pow); G.aim = null; }
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', function () { drag = null; if (G) G.aim = null; });
addEventListener('keydown', function (e) {
  startAudio();
  if (mode === 'game' && G) {
    var k = e.key; if (k === 'Escape' || k === 'p') { pause(); return; } if (k === 'r' || k === 'R') { startLevel(LI); return; }
    if (G.ball.moving || G.over) return;
    if (k === 'ArrowLeft') G.kAng -= e.shiftKey ? 0.01 : 0.05; else if (k === 'ArrowRight') G.kAng += e.shiftKey ? 0.01 : 0.05;
    else if (k === 'ArrowUp') G.kPow = Math.min(1, G.kPow + 0.05); else if (k === 'ArrowDown') G.kPow = Math.max(0.05, G.kPow - 0.05);
    else if (k === ' ' || k === 'Enter') { e.preventDefault(); shoot(G.kAng, G.kPow); return; } else return;
    e.preventDefault(); G.aim = { ang: G.kAng, pow: G.kPow };
  } else if (mode === 'win' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
  else if (mode === 'pause' && e.key === 'Escape') resume();
});
// tutorial: un deget fantomă trage în jos din mijlocul ecranului
function handAnim() {
  var p = (clock % 2.4) / 2.4, pull = p < 0.15 ? 0 : p < 0.7 ? (p - 0.15) / 0.55 : 1;
  G.handP = { x: VW / 2, y: VH * 0.42 + pull * Math.min(160, VH * 0.2), a: p < 0.08 ? p / 0.08 : p > 0.85 ? 1 - (p - 0.85) / 0.15 : 1, down: p > 0.1 && p < 0.72, y0: VH * 0.42 };
  G.ghost = !G.aim && pull > 0 && p < 0.72 ? { ang: -Math.PI / 2, pow: pull * 0.7 } : null;
}
function drawHand() {
  var h = G.handP; if (!h || G.aim || !G.hand) return; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = h.a;
  if (h.down) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(h.x, h.y0); ctx.lineTo(h.x, h.y); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle = 'rgba(255,255,255,' + (h.down ? 0.95 : 0.6) + ')'; ctx.beginPath(); ctx.arc(h.x, h.y, h.down ? 15 : 19, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,94,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(h.x, h.y, 24 + (h.down ? 0 : Math.sin(clock * 8) * 3), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
}

// ---------- ecrane ----------
var $ = function (id) { return document.getElementById(id); };
function show(m, overlay) {
  mode = m; document.querySelectorAll('.screen').forEach(function (e) { e.classList.remove('on'); });
  var inGame = m === 'game' || m === 'win' || m === 'pause';
  $('hud').classList.toggle('on', inGame); if (!inGame) { $('tip').classList.remove('on'); $('skip').classList.remove('on'); }
  if (m !== 'game' && $(m)) $(m).classList.add('on');
  if (m === 'menu') { menuDemo(); menuInfo(); initAmb(); } else if (!inGame && G && G.demo) { CUR = null; G = null; }
  if (m === 'levels') buildLevels(); if (m === 'skins') buildSkins(); if (m === 'settings') buildSettings();
}
function menuInfo() {
  var ts = totalStars(), nd = S.done.filter(Boolean).length;
  $('menuInfo').textContent = nd ? '★ ' + ts + ' / ' + LEVELS.length * 3 + '  ·  ' + t('hole') + ' ' + Math.min(LEVELS.length, firstOpen() + 1) : '';
  $('bPlay').textContent = nd ? t('cont') : t('play');
}
function firstOpen() { for (var i = 0; i < LEVELS.length; i++) if (!S.done[i]) return i; return LEVELS.length - 1; }
function unlocked(i) { return i === 0 || !!S.done[i - 1] || !!S.done[i]; }
function buildLevels() {
  var h = ''; $('lvStars').textContent = '★ ' + totalStars();
  for (var w = 0; w < LEVELS.length / 10; w++) {
    var ws = 0; for (var i = w * 10; i < w * 10 + 10; i++) ws += S.stars[i] || 0;
    h += '<div class="world"><h3>' + t('worlds')[w] + '<small>★ ' + ws + ' / 30</small></h3><div class="grid">';
    for (i = w * 10; i < w * 10 + 10; i++) {
      var u = unlocked(i), st = S.stars[i] || 0;
      h += '<button class="lv' + (u ? '' : ' lock') + (i === firstOpen() && u ? ' cur' : '') + '" data-lv="' + i + '"' + (u ? '' : ' disabled') + '>' + (u ? i + 1 : '🔒') + '<small>' + (u ? '★★★'.slice(0, st) + '☆☆☆'.slice(0, S.done[i] ? 3 - st : 0) : '') + '</small></button>';
    }
    h += '</div></div>';
  }
  $('lvList').innerHTML = h;
  $('lvList').querySelectorAll('[data-lv]').forEach(function (b) { b.onclick = function () { SFX.ui(); startLevel(+b.dataset.lv); }; });
}
function buildSkins() {
  var ts = totalStars(), h = ''; $('skStars').textContent = '★ ' + ts;
  SKINS.forEach(function (s, i) {
    var ok = ts >= s.need, bg = s.tr === 'rainbow' ? 'conic-gradient(#ff6b6b,#ffd75e,#7fe08a,#6bc8ff,#b88cff,#ff6b6b)' : 'radial-gradient(circle at 35% 30%,' + s.c0 + ',' + s.c1 + ')';
    h += '<button class="sk' + (S.skin === i ? ' on' : '') + '" data-sk="' + i + '"' + (ok ? '' : ' disabled') + '><i style="background:' + bg + '"></i>' + t('skinNames')[i] + '<small>' + (ok ? (S.skin === i ? '✓' : '') : '🔒 ' + t('need')(s.need)) + '</small></button>';
  });
  $('skList').innerHTML = h;
  $('skList').querySelectorAll('[data-sk]').forEach(function (b) { b.onclick = function () { S.skin = +b.dataset.sk; save(); SFX.ui(); buildSkins(); }; });
}
var resetArm = false;
function buildSettings() {
  var oo = function (v) { return v ? t('on') : t('off'); };
  $('sSound').textContent = oo(S.sound); $('sMusic').textContent = oo(S.music); $('sVibe').textContent = oo(S.vibe); $('sGuide').textContent = oo(S.guide);
  $('sLang').textContent = { en: 'English', ro: 'Română', ru: 'Русский' }[S.lang]; $('sReset').textContent = resetArm ? t('sure') : '↺';
}
function applyLang() { document.documentElement.lang = S.lang; document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.dataset.t); }); menuInfo(); }
function cycleLang() { S.lang = LANGS[(LANGS.indexOf(S.lang) + 1) % LANGS.length]; save(); applyLang(); }
function showTip(html) { var e = $('tip'); e.innerHTML = html; e.classList.add('on'); }
function hideTip() { $('tip').classList.remove('on'); }
var toastT = 0; function toast(s, ms) { var e = $('toast'); e.textContent = s; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove('on'); }, ms || 1100); }
function pause() { if (mode === 'game') show('pause'); }
function resume() { show('game'); }
$('bPlay').onclick = function () { startAudio(); SFX.ui(); startLevel(firstOpen()); };
$('bLevels').onclick = function () { startAudio(); SFX.ui(); show('levels'); };
$('bSkins').onclick = function () { SFX.ui(); show('skins'); };
$('bSettings').onclick = function () { SFX.ui(); resetArm = false; show('settings'); };
$('bLang').onclick = function () { SFX.ui(); cycleLang(); };
document.querySelectorAll('[data-back]').forEach(function (b) { b.onclick = function () { SFX.ui(); show('menu'); }; });
$('sSound').onclick = function () { S.sound = !S.sound; save(); buildSettings(); SFX.ui(); };
$('sMusic').onclick = function () { S.music = !S.music; save(); startAudio(); buildSettings(); };
$('sVibe').onclick = function () { S.vibe = !S.vibe; save(); buildSettings(); buzz(20); };
$('sGuide').onclick = function () { S.guide = !S.guide; save(); buildSettings(); };
$('sLang').onclick = function () { cycleLang(); buildSettings(); };
$('sReset').onclick = function () { if (!resetArm) { resetArm = true; buildSettings(); return; } resetArm = false; S.stars = []; S.best = []; S.done = []; S.tips = {}; S.skin = 0; save(); buildSettings(); toast(t('done')); };
$('hPause').onclick = function () { SFX.ui(); pause(); };
$('hRetry').onclick = function () { SFX.ui(); startLevel(LI); };
$('skip').onclick = function () { SFX.ui(); finish(true); };
$('pResume').onclick = function () { SFX.ui(); resume(); };
$('pRetry').onclick = function () { SFX.ui(); startLevel(LI); };
$('pLevels').onclick = function () { SFX.ui(); show('levels'); };
$('pMenu').onclick = function () { SFX.ui(); show('menu'); };
$('wNext').onclick = function () { SFX.ui(); next(); };
$('wRetry').onclick = function () { SFX.ui(); startLevel(LI); };
$('wLevels').onclick = function () { SFX.ui(); show('levels'); };
document.addEventListener('visibilitychange', function () { if (document.hidden && mode === 'game') pause(); });

// ---------- buclă ----------
var lastT = 0;
function frame(ts) {
  var dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts; clock += dt;
  if (mode === 'game' || mode === 'win') update(dt);
  if (mode === 'menu') demo(dt);
  if (G && G.hand && !G.aim && G.ghost) { G.aim = G.ghost; render(dt); G.aim = null; } else render(dt);
  if (G && G.hand && mode === 'game') drawHand();
  if (!window.__noLoop) requestAnimationFrame(frame);
}
resize(); applyLang(); menuDemo(); initAmb(); requestAnimationFrame(frame);
// mesaj „Noutăți” pentru jucătorii care au mai jucat (v1.1)
if (S.seen !== VERSION) { var hadPlayed = S.done.some(Boolean); S.seen = VERSION; save(); if (hadPlayed) setTimeout(function () { toast(t('whatsNew'), 4500); }, 900); }
</script>
